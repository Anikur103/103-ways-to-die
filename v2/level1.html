<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>103 Ways to Die - Level 1 (V2)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a2e; font-family:'Courier New', monospace; overflow:hidden; touch-action:none; }
  #game { display:block; width:100vw; height:100vh; image-rendering:pixelated; }
  .hud { position:fixed; top:0; left:0; right:0; padding:10px 14px; display:flex; justify-content:space-between; z-index:10; pointer-events:none; }
  .hud span { color:#fff; font-weight:bold; font-size:13px; font-family:'Courier New',monospace; }
  .controls { position:fixed; bottom:16px; left:0; right:0; display:flex; justify-content:space-between; padding:0 16px; z-index:10; }
  .btn { width:60px; height:60px; border-radius:8px; border:3px solid #fff; background:rgba(255,255,255,.15); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; user-select:none; font-family:'Courier New',monospace; font-weight:bold; }
  .btn:active { background:rgba(255,255,255,.35); }
  .btn.jump { width:76px; height:76px; background:rgba(255,80,80,.25); border-color:#ff5050; font-size:13px; }
  #msg { position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:18px; font-weight:bold; text-align:center; z-index:20; pointer-events:none; opacity:0; transition:opacity .3s; font-family:'Courier New',monospace; }
  #musicBtn { position:fixed; top:10px; right:14px; z-index:11; width:36px; height:36px; border-radius:8px; border:2px solid #fff; background:rgba(255,255,255,.15); color:#fff; font-size:16px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><span>LV 001</span><span id="deaths">💀0</span></div>
<button id="musicBtn">♪</button>
<div class="controls">
  <div style="display:flex;gap:10px"><div class="btn" id="left">◀</div><div class="btn" id="right">▶</div></div>
  <div class="btn jump" id="jump">JUMP</div>
</div>
<div id="msg"></div>
<script>
// ===== 103 Ways to Die V2 - Level 1 =====
// Minimalist pixel style (Level Devil inspired), clean & readable
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
let W,H,S;
function resize(){ W=innerWidth; H=innerHeight; canvas.width=W; canvas.height=H; S=Math.min(W/480,H/270); }
addEventListener('resize',resize); resize();
ctx.imageSmoothingEnabled = false;

// Music: simple chiptune loop
let AC=null, musicOn=true, mStep=0, mTimer=null;
const MEL=[0,-1,4,-1,7,-1,4,-1, 5,-1,9,-1,7,-1,4,-1];
function nf(s){return 220*Math.pow(2,s/12);}
function startMusic(){
  if(AC||!musicOn) return;
  try{
    AC=new (AudioContext||webkitAudioContext)();
    const play=()=>{
      if(!musicOn||!AC) return;
      const t=AC.currentTime, n=MEL[mStep%MEL.length];
      if(n>=0){
        const o=AC.createOscillator(),g=AC.createGain();
        o.type='square'; o.frequency.value=nf(n);
        g.gain.setValueAtTime(.04,t); g.gain.exponentialRampToValueAtTime(.001,t+.2);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.22);
      }
      mStep++;
    };
    play(); mTimer=setInterval(play,210);
  }catch(e){}
}
function stopMusic(){ if(mTimer)clearInterval(mTimer); mTimer=null; if(AC){AC.close().catch(()=>{}); AC=null;} }
document.getElementById('musicBtn').onclick=e=>{e.stopPropagation();musicOn=!musicOn;document.getElementById('musicBtn').textContent=musicOn?'♪':'✕';document.getElementById('musicBtn').style.opacity=musicOn?1:.4;musicOn?startMusic():stopMusic();};
addEventListener('pointerdown',()=>{if(musicOn)startMusic();},{once:false});

// Player: simple pixel character (clear & readable)
const P={x:30,y:0,w:14,h:20,vx:0,vy:0,ground:false,face:1};
let deaths=0, cam=0;

// Level 1: "First Steps" - teach move & jump. Goal UP HIGH (not just right!)
const PLATS=[
  {x:0,y:220,w:120,h:50},
  {x:140,y:220,w:80,h:50},   // small gap
  {x:240,y:190,w:80,h:80},   // step up
  {x:340,y:160,w:80,h:110},  // higher
  // GOAL is UP on a high platform - not just to the right!
];
const GOAL={x:355,y:110,w:24,h:50}; // floating above last platform
const LW=480;

const K={l:0,r:0};
const b=(id,k)=>{const e=document.getElementById(id);e.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;});['pointerup','pointerleave','pointercancel'].forEach(ev=>e.addEventListener(ev,()=>K[k]=0));};
b('left','l'); b('right','r');
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(P.ground){P.vy=-8.5;P.ground=false;}});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')K.l=1;if(e.key==='ArrowRight')K.r=1;if(e.key===' '&&P.ground){P.vy=-8.5;P.ground=false;}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')K.l=0;if(e.key==='ArrowRight')K.r=0;});

function msg(t,ms=1400){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;setTimeout(()=>m.style.opacity=0,ms);}
function reset(){P.x=30;P.y=150;P.vx=0;P.vy=0;cam=0;}

function upd(){
  const SP=2.6;
  if(K.l){P.vx=-SP;P.face=-1;}else if(K.r){P.vx=SP;P.face=1;}else P.vx*=0.7;
  P.vy+=0.45; if(P.vy>10)P.vy=10;
  P.x+=P.vx; P.y+=P.vy; P.ground=false;
  for(const p of PLATS){
    if(P.x<p.x+p.w&&P.x+P.w>p.x&&P.y<p.y+p.h&&P.y+P.h>p.y){
      if(P.vy>0&&P.y+P.h-P.vy<=p.y+8){P.y=p.y-P.h;P.vy=0;P.ground=true;}
      else if(P.vy<0&&P.y-P.vy>=p.y+p.h-8){P.y=p.y+p.h;P.vy=0;}
      else if(P.vx>0){P.x=p.x-P.w;}else if(P.vx<0){P.x=p.x+p.w;}
    }
  }
  if(P.x<0)P.x=0;
  if(P.y>300){deaths++;document.getElementById('deaths').textContent='💀'+deaths;msg('Try again!');reset();}
  if(P.x<GOAL.x+GOAL.w&&P.x+P.w>GOAL.x&&P.y<GOAL.y+GOAL.h&&P.y+P.h>GOAL.y){
    msg('🎉 Level Clear!',2000); P.x=-100;
    setTimeout(()=>msg('Level 2 soon...'),2200);
  }
  cam=Math.max(0,Math.min(P.x-180,LW-480));
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  const ox=(W-480*S)/2, oy=(H-270*S)/2;
  ctx.translate(ox,oy); ctx.scale(S,S); ctx.translate(-Math.round(cam),0);
  
  // BG: dark with subtle grid
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(cam,0,480,270);
  ctx.fillStyle='rgba(255,255,255,.03)';
  for(let gx=0;gx<480;gx+=24)ctx.fillRect(cam+gx,0,1,270);
  for(let gy=0;gy<270;gy+=24)ctx.fillRect(cam,gy,480,1);
  
  // Platforms: clean pixel blocks
  for(const p of PLATS){
    ctx.fillStyle='#2d2d44'; ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#4a4a6a'; ctx.fillRect(p.x,p.y,p.w,4); // top highlight
    ctx.fillStyle='#1a1a2e';
    for(let dx=8;dx<p.w-4;dx+=16)ctx.fillRect(p.x+dx,p.y+12,8,3);
  }
  
  // Goal: glowing door UP HIGH
  ctx.fillStyle='#d9ff4f'; ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(GOAL.x+4,GOAL.y+4,GOAL.w-8,GOAL.h-8);
  ctx.fillStyle='#d9ff4f'; ctx.fillRect(GOAL.x+8,GOAL.y+10,GOAL.w-16,GOAL.h-20);
  // Arrow pointing up to goal
  ctx.fillStyle='#fff'; ctx.font='bold 10px monospace';
  ctx.fillText('▲ GOAL',GOAL.x-8,GOAL.y-8);
  
  // Player: SIMPLE pixel character (clear!)
  const px=Math.round(P.x), py=Math.round(P.y);
  ctx.save(); ctx.translate(px+P.w/2,py); if(P.face<0)ctx.scale(-1,1);
  // Body: 14x20 simple robot
  ctx.fillStyle='#3b82f6'; ctx.fillRect(-7,4,14,12); // torso
  ctx.fillStyle='#1d4ed8'; ctx.fillRect(-7,12,14,4); // lower
  ctx.fillStyle='#93c5fd'; ctx.fillRect(-6,-2,12,8); // head
  ctx.fillStyle='#0f172a'; ctx.fillRect(-5,0,10,4); // visor
  ctx.fillStyle='#4ade80'; ctx.fillRect(-3,1,3,2); ctx.fillRect(2,1,3,2); // eyes
  // Legs
  const sw=Math.abs(P.vx)>0.3?Math.sin(Date.now()*0.015)*2:0;
  ctx.fillStyle='#1e3a5f'; ctx.fillRect(-5,16,4,4+sw); ctx.fillRect(1,16,4,4-sw);
  // Arm
  ctx.fillStyle='#3b82f6'; ctx.fillRect(5,6,3,8);
  ctx.restore();
  
  ctx.restore();
}

reset(); msg('Reach the ▲ GOAL up high!',2200);
(function loop(){upd();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
