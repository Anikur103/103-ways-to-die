<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>103 Ways to Die - Level 1</title>
<!-- v1.3: fractional scaling, music resume fix, ambient particles -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0f1420;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none}
  #game{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  .hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
  .hud span{color:#e8f0ff;font-weight:bold;font-size:14px;letter-spacing:1px}
  .hud .right{display:flex;align-items:center;gap:10px;pointer-events:auto}
  #musicBtn{width:34px;height:34px;border-radius:6px;border:2px solid #3ddc84;background:rgba(61,220,132,.12);color:#3ddc84;font-size:15px;cursor:pointer}
  .controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:10}
  .btn{width:64px;height:64px;border-radius:6px;border:3px solid #e8f0ff;background:rgba(232,240,255,.08);color:#e8f0ff;font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .btn:active{background:rgba(232,240,255,.25)}
  .btn.jump{width:84px;height:84px;background:rgba(61,220,132,.12);border-color:#3ddc84;color:#3ddc84;font-size:14px}
  #msg{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:20px;font-weight:bold;text-align:center;z-index:20;pointer-events:none;opacity:0;transition:opacity .25s;letter-spacing:1px;white-space:nowrap}
  #deathFlash{position:fixed;inset:0;background:#ff2d55;opacity:0;pointer-events:none;z-index:15;transition:opacity .1s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><span>LV 001</span><div class="right"><span id="deaths">☠ 0</span><button id="musicBtn">♪</button></div></div>
<div class="controls">
  <div style="display:flex;gap:12px"><div class="btn" id="btnL">◀</div><div class="btn" id="btnR">▶</div></div>
  <div class="btn jump" id="btnJ">JUMP</div>
</div>
<div id="msg"></div>
<div id="deathFlash"></div>
<script>
"use strict";
/* ===== 103 Ways to Die V2 — minimalist pixel, own identity ===== */
const cv=document.getElementById('game'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
let W,H,S;
function rs(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;S=Math.min(W/480,H/270);}
addEventListener('resize',rs);rs();

/* --- Music: dark chiptune --- */
let AC=null,musicOn=true,mi=0,mt=null;
const MEL=[7,-1,3,-1,5,-1,3,-1, 2,-1,7,-1,5,-1,3,-1];
function nf(s){return 196*Math.pow(2,s/12);}
function mStart(){
  if(!musicOn)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(mt)return;
    const tick=()=>{
      if(!musicOn||!AC)return;
      const n=MEL[mi%MEL.length];mi++;
      if(n>=0){
        const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
        o.type='triangle';o.frequency.value=nf(n);
        g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
        o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.24);
      }
    };
    tick();mt=setInterval(tick,230);
  }catch(e){}
}
function mStop(){if(mt)clearInterval(mt);mt=null;if(AC){AC.close().catch(()=>{});AC=null;}}
document.getElementById('musicBtn').onclick=e=>{e.stopPropagation();musicOn=!musicOn;document.getElementById('musicBtn').textContent=musicOn?'♪':'✕';musicOn?mStart():mStop();};
addEventListener('pointerdown',()=>{if(musicOn)mStart();});

/* --- Input --- */
const K={l:0,r:0};
function bind(id,k){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>K[k]=0));}
bind('btnL','l');bind('btnR','r');
document.getElementById('btnJ').addEventListener('pointerdown',e=>{e.preventDefault();doJump();});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')K.l=1;if(e.key==='ArrowRight'||e.key==='d')K.r=1;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')doJump();if(e.repeat)e.preventDefault();});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')K.l=0;if(e.key==='ArrowRight'||e.key==='d')K.r=0;});

/* --- Level 1: "First Steps" — NO TRAPS, pure tutorial --- */
const LW=480,LH=270;
const PLATS=[
  {x:0,y:220,w:480,h:50},  // one long safe floor (like Level Devil L1)
];
const GOAL={x:420,y:170,w:28,h:50};  // glowing exit gate on the right
const SPAWN={x:30,y:180};

/* --- Player: small pixel WISP (own character, not a devil) --- */
const P={x:SPAWN.x,y:SPAWN.y,w:12,h:18,vx:0,vy:0,ground:false,face:1,dead:false,win:false};
let deaths=0,cam=0,shake=0,clearT=0,absorb=0,doorClose=0;

function doJump(){if(P.ground&&!P.dead&&!P.win){P.vy=-8.2;P.ground=false;}}
function showMsg(t,ms){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;clearTimeout(m._t);m._t=setTimeout(()=>m.style.opacity=0,ms||1500);}
function die(){
  if(P.dead||P.win)return;
  P.dead=true;deaths++;document.getElementById('deaths').textContent='☠ '+deaths;
  const f=document.getElementById('deathFlash');f.style.opacity=.35;
  setTimeout(()=>f.style.opacity=0,120);
  shake=6;
  setTimeout(()=>{P.x=SPAWN.x;P.y=SPAWN.y;P.vx=0;P.vy=0;P.dead=false;},450);
}
function reset(){P.x=SPAWN.x;P.y=SPAWN.y;P.vx=0;P.vy=0;P.dead=false;P.win=false;cam=0;absorb=0;doorClose=0;}

function update(){
  if(P.win){
    clearT++;
    // absorb animation: player shrinks into portal
    if(absorb<1)absorb=Math.min(1,absorb+0.04);
    // door closes behind the player
    if(absorb>=1&&doorClose<1)doorClose=Math.min(1,doorClose+0.06);
    if(clearT===60)showMsg('★ CLEAR ★',1800);
    return;
  }
  const SP=2.4;
  if(!P.dead){
    if(K.l){P.vx=-SP;P.face=-1;}else if(K.r){P.vx=SP;P.face=1;}else P.vx*=0.72;
  }
  P.vy+=0.42;if(P.vy>9)P.vy=9;
  P.x+=P.vx;P.y+=P.vy;P.ground=false;
  for(const p of PLATS){
    if(P.x<p.x+p.w&&P.x+P.w>p.x&&P.y<p.y+p.h&&P.y+P.h>p.y){
      if(P.vy>=0&&P.y+P.h-P.vy<=p.y+9){P.y=p.y-P.h;P.vy=0;P.ground=true;}
      else if(P.vy<0&&P.y-P.vy>=p.y+p.h-9){P.y=p.y+p.h;P.vy=0;}
      else if(P.vx>0)P.x=p.x-P.w;else if(P.vx<0)P.x=p.x+p.w;
    }
  }
  if(P.x<0)P.x=0;if(P.x>LW-P.w)P.x=LW-P.w;
  if(P.y>LH+40)die();
  // goal: player must walk INTO the portal center (no touch-edge win)
  if(!P.dead&&!P.win){
    const pcx=P.x+P.w/2, pcy=P.y+P.h/2;
    if(pcx>GOAL.x+4&&pcx<GOAL.x+GOAL.w-4&&pcy>GOAL.y&&pcy<GOAL.y+GOAL.h){
      P.win=true;clearT=0;absorb=0;
    }
  }
  cam=Math.max(0,Math.min(P.x-200,LW-480));
  if(shake>0)shake*=0.85;
}

function draw(){
  cx.setTransform(1,0,0,1,0,0);
  // Full-canvas ambient background (no dead black bars)
  cx.fillStyle='#0b0f1a';cx.fillRect(0,0,W,H);
  // animated floating particles across whole screen
  cx.fillStyle='rgba(61,220,132,.12)';
  const pt=Date.now()*0.00003;
  for(let i=0;i<40;i++){
    const px=((i*197.3)%1)*W, py=(((i*311.7)%1)+pt*(1+(i%3)*0.4))%1*H;
    const sz=1+(i%3);
    cx.fillRect(px,py,sz,sz);
  }
  cx.fillStyle='rgba(120,160,220,.04)';
  const gs=Math.max(18,Math.round(24*S/2));
  for(let gx=0;gx<W;gx+=gs)cx.fillRect(gx,0,1,H);
  for(let gy=0;gy<H;gy+=gs)cx.fillRect(0,gy,W,1);
  const ox=Math.round((W-480*S)/2),oy=Math.round((H-270*S)/2);
  cx.save();
  cx.translate(ox,oy);cx.scale(S,S);
  if(shake>0.3)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  cx.translate(-Math.round(cam),0);

  // BG: dark slate + faint grid (own palette)
  cx.fillStyle='#0f1420';cx.fillRect(cam-10,0,500,270);
  cx.fillStyle='rgba(120,160,220,.05)';
  for(let gx=0;gx<480;gx+=30)cx.fillRect(cam+gx-(cam%30),0,1,270);
  for(let gy=0;gy<270;gy+=30)cx.fillRect(cam-10,gy,500,1);
  // distant glow dots (stars)
  cx.fillStyle='rgba(160,200,255,.25)';
  const stars=[[40,40],[120,70],[200,30],[300,60],[380,35],[450,80],[90,120],[260,110],[360,130],[20,180]];
  for(const s of stars)cx.fillRect(s[0],s[1],2,2);

  // Platforms: slate blocks w/ teal top edge
  for(const p of PLATS){
    cx.fillStyle='#232c44';cx.fillRect(p.x,p.y,p.w,p.h);
    cx.fillStyle='#3ddc84';cx.fillRect(p.x,p.y,p.w,3);
    cx.fillStyle='#161d30';
    for(let dx=10;dx<p.w-6;dx+=26)cx.fillRect(p.x+dx,p.y+14,14,3);
  }

  // GOAL: mysterious dark portal — NO label, NO hint (deception is the game)
  // doorClose: 0=open, 1=shut (closes behind player)
  const gl=0.6+0.4*Math.sin(Date.now()*0.006);
  const dc=doorClose;
  const gcx=GOAL.x+GOAL.w/2, gw2=(GOAL.w/2)*(1-dc);
  // subtle outer glow (barely visible)
  if(dc<1){cx.fillStyle='rgba(120,80,220,'+(0.12*gl*(1-dc))+')';cx.fillRect(GOAL.x-8,GOAL.y-8,GOAL.w+16,GOAL.h+16);}
  // dark void (shrinks as door closes)
  cx.fillStyle='#05060a';cx.fillRect(gcx-gw2,GOAL.y,gw2*2,GOAL.h);
  // faint purple inner shimmer
  if(dc<1){cx.fillStyle='rgba(150,100,255,'+((0.25+0.2*gl)*(1-dc))+')';
  cx.fillRect(gcx-2*(1-dc),GOAL.y+6,4*(1-dc),GOAL.h-12);}
  // thin frame (frame stays, void closes)
  cx.fillStyle='#2a2438';cx.fillRect(GOAL.x,GOAL.y,GOAL.w,2);cx.fillRect(GOAL.x,GOAL.y+GOAL.h-2,GOAL.w,2);
  cx.fillRect(GOAL.x,GOAL.y,2,GOAL.h);cx.fillRect(GOAL.x+GOAL.w-2,GOAL.y,2,GOAL.h);

  // Player: WISP — small cyan pixel spirit (simple, readable)
  // during win: shrink into the portal
  if(!P.dead&&(absorb<1||!P.win)){
    const px=Math.round(P.x),py=Math.round(P.y);
    const bob=P.ground&&!P.win?Math.round(Math.sin(Date.now()*0.008)*1):0;
    const sc=P.win?(1-absorb):1;
    cx.save();cx.translate(px+P.w/2,py+bob+P.h/2);cx.scale(sc*(P.face<0?-1:1),sc);cx.translate(-P.w/2,-P.h/2);
    // body
    cx.fillStyle='#7ef0ff';cx.fillRect(-6,2,12,12);
    cx.fillStyle='#2fb9d4';cx.fillRect(-6,10,12,4);
    // head
    cx.fillStyle='#bdfaff';cx.fillRect(-5,-4,10,7);
    // eyes (white glow)
    cx.fillStyle='#0f1420';cx.fillRect(-3,-2,3,3);cx.fillRect(1,-2,3,3);
    cx.fillStyle='#fff';cx.fillRect(-2,-1,1,1);cx.fillRect(2,-1,1,1);
    // little feet
    const st=Math.abs(P.vx)>0.3?(Date.now()*0.02|0)%2:0;
    cx.fillStyle='#2fb9d4';cx.fillRect(-5,14,4,3+st);cx.fillRect(1,14,4,4-st);
    // wisp tail
    cx.fillStyle='rgba(126,240,255,.5)';cx.fillRect(-8,6,2,6);
    cx.restore();
  }

  // Win sparkles (after door fully shut)
  if(P.win&&doorClose>=1){
    cx.fillStyle='#9a6bff';
    for(let i=0;i<12;i++){
      const a=Date.now()*0.004+i*0.5;
      cx.fillRect(GOAL.x+GOAL.w/2+Math.cos(a)*20*gl-1,GOAL.y+20+Math.sin(a)*20*gl-1,2,2);
    }
    if(clearT>160){cx.fillStyle='#e8f0ff';cx.font='bold 14px monospace';cx.textAlign='center';cx.fillText('Level 2 → soon',cam+240,140);}
  }

  cx.restore();
}

reset();
showMsg('Walk right →',2000);
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
