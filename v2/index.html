<style>

  #playBtn{padding:12px 48px;font-size:16px;font-family:'Courier New',monospace;font-weight:bold;letter-spacing:2px;color:#0b0f1a;background:#3ddc84;border:none;border-radius:6px;cursor:pointer}

    const tick=()=>{
      if(!musicOn||!AC)return;
      const n=MEL[mi%MEL.length];mi++;
      if(n>=0){
        const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();

      }
    };
    tick();mt=setInterval(tick,230);
  }catch(e){}
}
function mStop(){if(mt)clearInterval(mt);mt=null;if(AC){AC.close().catch(()=>{});AC=null;}}

:[{"x":0,"y":220,"w":120,"h":50},{"x":120,"y":220,"w":55,"h":50},{"x":175,"y":220,"w":100,"h":50},{"x":275,"y":220,"w":205,"h":50}],"s":{"x":20,"y":180},"g":{"x":430,"y":170},"traps":[{"t":"pit","pi":1,"trig":60},{"t":"spike","x":190,"y":220,"w":30,"trig":60},{"t":"saw","x":320,"y":200,"x1":290,"x2":400,"dx":2.2}]},{"p":[{"x":0,"y":220,"w":480,"h":50}],"s":{"x":30,"y":180},"g":{"x":240,"y":170},"traps":[{"t":"fake","x":100,"y":170},{"t":"fake","x":420,"y":170},{"t":"drop","x":200,"y":-40,"w":34,"h":34},{"t":"drop","x":300,"y":-80,"w":34,"h":34}]},{"p":[{"x":0,"y":220,"w":100,"h":50},{"x":130,"y":180,"w":60,"h":50},{"x":190,"y":180,"w":120,"h":50},{"x":310,"y":180,"w":40,"h":50},{"x":370,"y":220,"w":110,"h":50}],"s":{"x":20,"y":180},"g":{"x":430,"y":170},"traps":[{"t":"pit","pi":3,"trig":250},{"t":"spike","x":200,"y":180,"w":30,"trig":60},{"t":"saw","x":390,"y":200,"x1":370,"x2":450,"dx":2.0},{"t":"fall","pi":2,"warn":100}]}];


/* ===== GAME STATE ===== */
let LI=0, deaths=0;
let P={x:0,y:0,w:12,h:18,vx:0,vy:0,ground:false,face:1,dead:false,win:false};
let cam=0,shake=0,clearT=0,absorb=0,doorClose=0,fadeT=0;
let trapState=[];
let unlocked=parseInt(localStorage.getItem('wtd_unlocked')||'1');
let totalDeaths=parseInt(localStorage.getItem('wtd_deaths')||'0');

function cur(){return LEVELS[LI];}
function doJump(){if(P.ground&&!P.dead&&!P.win){P.vy=-8.2;P.ground=false;}}

function loadLevel(i){
  LI=i;const L=cur();
  P.x=L.s.x;P.y=L.s.y;P.vx=0;P.vy=0;P.ground=false;P.dead=false;P.win=false;P.face=1;
  cam=0;shake=0;clearT=0;absorb=0;doorClose=0;fadeT=0;
  trapState=(L.traps||[]).map(t=>({...t,active:false,timer:0}));
  document.getElementById('lvLabel').textContent='LV '+String(i+1).padStart(3,'0');
}

function die(){
  if(P.dead||P.win)return;
  P.dead=true;deaths++;totalDeaths++;
  document.getElementById('deaths').textContent='☠ '+deaths;
  localStorage.setItem('wtd_deaths',totalDeaths);
  const f=document.getElementById('deathFlash');f.style.opacity=.35;
  setTimeout(()=>f.style.opacity=0,120);
  shake=6;
  setTimeout(()=>{const L=cur();P.x=L.s.x;P.y=L.s.y;P.vx=0;P.vy=0;P.dead=false;
    trapState=(L.traps||[]).map(t=>({...t,active:false,timer:0}));},450);
}

function nextLevel(){
  const nl=LI+1;
  if(nl<LEVELS.length){
    if(nl+1>unlocked){unlocked=nl+1;localStorage.setItem('wtd_unlocked',unlocked);}
    loadLevel(nl);
  }else{
    showMenu(); // completed all
  }
}

/* ===== UPDATE ===== */
function update(){
  const L=cur();
  if(P.win){
    clearT++;
    if(absorb<1)absorb=Math.min(1,absorb+0.04);
    if(absorb>=1&&doorClose<1)doorClose=Math.min(1,doorClose+0.06);
    if(doorClose>=1){
      fadeT=Math.min(1,fadeT+0.025);
      if(fadeT>=1&&clearT>110)nextLevel();
    }
    return;
  }
  const SP=2.4;
  if(!P.dead){
    if(K.l){P.vx=-SP;P.face=-1;}else if(K.r){P.vx=SP;P.face=1;}else P.vx*=0.72;
  }
  P.vy+=0.42;if(P.vy>9)P.vy=9;
  P.x+=P.vx;P.y+=P.vy;P.ground=false;

  // platforms (skip vanished pit segments)
  const plats=L.p.filter(pl=>{
    const ts=trapState.find(t=>t.t==='pit'&&t.pi===L.p.indexOf(pl));
    return !(ts&&ts.active);
  });
  for(const pl of plats){
    if(P.x<pl.x+pl.w&&P.x+P.w>pl.x&&P.y<pl.y+pl.h&&P.y+P.h>pl.y){
      if(P.vy>=0&&P.y+P.h-P.vy<=pl.y+9){P.y=pl.y-P.h;P.vy=0;P.ground=true;
        // falling platform trigger
        const ts=trapState.find(t=>t.t==='fall'&&t.pi===L.p.indexOf(pl));
        if(ts&&!ts.active){ts.active=true;ts.timer=ts.warn||25;}
      }
      else if(P.vy<0&&P.y-P.vy>=pl.y+pl.h-9){P.y=pl.y+pl.h;P.vy=0;}
      else if(P.vx>0)P.x=pl.x-P.w;else if(P.vx<0)P.x=pl.x+pl.w;
    }
  }
  if(P.x<0)P.x=0;if(P.x>LW-P.w)P.x=LW-P.w;

  // traps
  for(const ts of trapState){
    if(ts.t==='pit'&&!ts.active&&P.x>ts.trig){ts.active=true;}
    if(ts.t==='spike'&&!ts.active&&Math.abs((P.x+P.w/2)-ts.x)<ts.trig){ts.active=true;ts.timer=12;}
    if(ts.t==='spike'&&ts.active&&ts.timer>0){ts.timer--;
      if(ts.timer===0){
        // check kill
        if(P.x<ts.x+ts.w&&P.x+P.w>ts.x&&P.y+P.h>ts.y&&P.y<ts.y+20)die();
      }}
    if(ts.t==='fall'&&ts.active){ts.timer--;
      if(ts.timer<=0){/* platform gone handled by filter */}
    }
    if(ts.t==='drop'&&!ts.active&&P.x<ts.x+ts.w&&P.x+P.w>ts.x){ts.active=true;ts.vy=0;}
    if(ts.t==='drop'&&ts.active){ts.vy+=0.5;ts.y+=ts.vy;
      if(P.x<ts.x+ts.w&&P.x+P.w>ts.x&&P.y<ts.y+ts.h&&P.y+P.h>ts.y)die();}
    if(ts.t==='saw'){
      ts.x+=ts.dx;if(ts.x<ts.x1||ts.x>ts.x2)ts.dx*=-1;
      const scx=P.x+P.w/2,scy=P.y+P.h/2;
      const dx=scx-(ts.x+10),dy=scy-(ts.y+10);
      if(dx*dx+dy*dy<18*18)die();
    }
    if(ts.t==='fake'){
      const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
      if(pcx>ts.x+4&&pcx<ts.x+24&&pcy>ts.y&&pcy<ts.y+50)die();
    }
  }
  // remove fully-crumbled fall platforms from collision
  for(const ts of trapState){
    if(ts.t==='fall'&&ts.active&&ts.timer<=0){
      const idx=L.p.indexOf(L.p[ts.pi]);
      // mark for filter
      ts.gone=true;
    }
  }

  if(P.y>LH+40)die();

  // portal enter (walk INTO center)
  const G=L.g;
  if(!P.dead){
    const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
    if(pcx>G.x+4&&pcx<G.x+24&&pcy>G.y&&pcy<G.y+50){P.win=true;clearT=0;absorb=0;}
  }
  cam=Math.max(0,Math.min(P.x-200,LW-480));
  if(shake>0)shake*=0.85;
}

/* ===== DRAW ===== */
function draw(){
  const L=cur();
  cx.setTransform(1,0,0,1,0,0);
  cx.fillStyle='#0b0f1a';cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(61,220,132,.10)';
  const pt=Date.now()*0.00003;
  for(let i=0;i<40;i++){
    const px=((i*197.3)%1)*W,py=(((i*311.7)%1)+pt*(1+(i%3)*0.4))%1*H;
    cx.fillRect(px,py,1+(i%3),1+(i%3));
  }
  cx.fillStyle='rgba(120,160,220,.04)';
  const gs=Math.max(18,Math.round(24*S/2));
  for(let gx=0;gx<W;gx+=gs)cx.fillRect(gx,0,1,H);
  for(let gy=0;gy<H;gy+=gs)cx.fillRect(0,gy,W,1);

  const ox=Math.round((W-480*S)/2),oy=Math.round((H-270*S)/2);
  cx.save();cx.translate(ox,oy);cx.scale(S,S);
  if(shake>0.3)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  cx.translate(-Math.round(cam),0);

  cx.fillStyle='#0f1420';cx.fillRect(cam-10,0,500,270);

  // platforms — VISUALLY MERGED so pit traps are pixel-invisible
  // (collision still uses segments; visuals merge adjacent same-y platforms)
  const visPlats=[];
  const sorted=[...L.p].sort((a,b)=>a.y-b.y||a.x-b.x);
  let cur=null;
  for(const pl of sorted){
    const pi=L.p.indexOf(pl);
    const ts=trapState.find(t=>(t.t==='pit'||t.t==='fall')&&t.pi===pi);
    const hidden=ts&&(ts.active&&(ts.t==='pit'||ts.gone));
    if(hidden){ if(cur){visPlats.push(cur);cur=null;} continue; }
    let alpha=1, crumbling=false;
    if(ts&&ts.t==='fall'&&ts.active){alpha=Math.max(0.2,ts.timer/(ts.warn||25));crumbling=true;}
    if(cur&&!crumbling&&!cur.crumbling&&cur.y===pl.y&&pl.x<=cur.x+cur.w+1){
      cur.w=Math.max(cur.x+cur.w,pl.x+pl.w)-cur.x;
    }else{
      if(cur)visPlats.push(cur);
      cur={x:pl.x,y:pl.y,w:pl.w,h:pl.h,alpha,crumbling};
    }
  }
  if(cur)visPlats.push(cur);
  for(const vp of visPlats){
    cx.globalAlpha=vp.alpha;
    cx.fillStyle='#232c44';cx.fillRect(vp.x,vp.y,vp.w,vp.h);
    cx.fillStyle='#3ddc84';cx.fillRect(vp.x,vp.y,vp.w,3);
    cx.globalAlpha=1;
  }

  // spikes
  for(const ts of trapState){
    if(ts.t!=='spike'||!ts.active)continue;
    const prog=1-ts.timer/12;
    const sh=20*prog;
    cx.fillStyle='#ff2d55';
    for(let sx=ts.x;sx<ts.x+ts.w;sx+=10){
      cx.beginPath();cx.moveTo(sx,ts.y+4);cx.lineTo(sx+5,ts.y+4-sh);cx.lineTo(sx+10,ts.y+4);cx.fill();
    }
  }
  // falling blocks
  for(const ts of trapState){
    if(ts.t!=='drop')continue;
    cx.fillStyle='#4a3a5a';cx.fillRect(ts.x,ts.y,ts.w,ts.h);
    cx.fillStyle='#ff2d55';cx.fillRect(ts.x,ts.y+ts.h-4,ts.w,4);
  }
  // saws
  for(const ts of trapState){
    if(ts.t!=='saw')continue;
    cx.save();cx.translate(ts.x+10,ts.y+10);cx.rotate(Date.now()*0.01);
    cx.fillStyle='#c0c8d8';
    for(let i=0;i<8;i++){cx.rotate(Math.PI/4);cx.fillRect(-2,-12,4,24);}
    cx.fillStyle='#ff2d55';cx.beginPath();cx.arc(0,0,4,0,7);cx.fill();
    cx.restore();
  }
  // fake portals (look identical to real)
  for(const ts of trapState){
    if(ts.t!=='fake')continue;
    drawPortal(ts.x,ts.y,0);
  }

  // real portal
  const G=L.g;
  drawPortal(G.x,G.y,doorClose);

  // player wisp
  if(!P.dead&&(absorb<1||!P.win)){
    const px=Math.round(P.x),py=Math.round(P.y);
    const bob=P.ground&&!P.win?Math.round(Math.sin(Date.now()*0.008)*1):0;
    const sc=P.win?(1-absorb):1;
    cx.save();cx.translate(px+P.w/2,py+bob+P.h/2);cx.scale(sc*(P.face<0?-1:1),sc);cx.translate(-P.w/2,-P.h/2);
    cx.fillStyle='#7ef0ff';cx.fillRect(-6,2,12,12);
    cx.fillStyle='#2fb9d4';cx.fillRect(-6,10,12,4);
    cx.fillStyle='#bdfaff';cx.fillRect(-5,-4,10,7);
    cx.fillStyle='#0f1420';cx.fillRect(-3,-2,3,3);cx.fillRect(1,-2,3,3);
    cx.fillStyle='#fff';cx.fillRect(-2,-1,1,1);cx.fillRect(2,-1,1,1);
    const st=Math.abs(P.vx)>0.3?(Date.now()*0.02|0)%2:0;
    cx.fillStyle='#2fb9d4';cx.fillRect(-5,14,4,3+st);cx.fillRect(1,14,4,4-st);
    cx.fillStyle='rgba(126,240,255,.5)';cx.fillRect(-8,6,2,6);
    cx.restore();
  }

  // win sparkles
  if(P.win&&doorClose>=1&&fadeT<0.5){
    cx.fillStyle='#9a6bff';
    for(let i=0;i<10;i++){
      const a=Date.now()*0.004+i*0.6;
      cx.fillRect(G.x+14+Math.cos(a)*18-1,G.y+20+Math.sin(a)*18-1,2,2);
    }
  }
  cx.restore();
  if(fadeT>0){cx.setTransform(1,0,0,1,0,0);cx.fillStyle='rgba(0,0,0,'+fadeT+')';cx.fillRect(0,0,W,H);}
}

function drawPortal(x,y,dc){
  const gl=0.6+0.4*Math.sin(Date.now()*0.006);
  if(dc>=1)return;
  cx.fillStyle='rgba(120,80,220,'+(0.12*gl*(1-dc))+')';cx.fillRect(x-8,y-8,44,66);
  const gcx=x+14,gw=14*(1-dc);
  cx.fillStyle='#05060a';cx.fillRect(gcx-gw,y,gw*2,50);
  cx.fillStyle='rgba(150,100,255,'+((0.25+0.2*gl)*(1-dc))+')';
  cx.fillRect(gcx-2*(1-dc),y+6,4*(1-dc),38);
  cx.fillStyle='rgba(42,36,56,'+(1-dc)+')';
  cx.fillRect(x,y,28,2);cx.fillRect(x,y+48,28,2);cx.fillRect(x,y,2,50);cx.fillRect(x+26,y,2,50);
}

/* ===== MENU ===== */
function showMenu(){
  document.getElementById('menu').style.display='flex';
  document.getElementById('hud').style.display='none';
  document.getElementById('controls').style.display='none';
  const grid=document.getElementById('levelGrid');grid.innerHTML='';
  LEVELS.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='lvbtn'+(i<unlocked?' open':'')+(i<unlocked-1?' done':'');
    b.textContent=i+1;
    if(i<unlocked)b.onclick=()=>startGame(i);
    grid.appendChild(b);
  });
}
function startGame(i){
  document.getElementById('menu').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('controls').style.display='flex';
  deaths=0;document.getElementById('deaths').textContent='☠ 0';
  loadLevel(i||0);
  if(musicOn)mStart();
}
document.getElementById('playBtn').onclick=()=>startGame(Math.min(unlocked-1,LEVELS.length-1));

showMenu();
(function loop(){if(document.getElementById('menu').style.display==='none'){update();draw();}requestAnimationFrame(loop);})();
</script>
