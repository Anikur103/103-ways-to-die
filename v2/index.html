   2.5-3 tile jump, instant retry, full reset on death). */

// TRAPSTEP levels — World 1: Drafting Yard (L1-10)
// Each level: {name, world, map:[8 strings], init(room), tick(room), draw(room,cx)}
// Mechanics library is in trapstep.html (mechCrumble, mechSaw, etc.)
const WORLD1=[
{

},

map:[

"#................#",
"#................#",
"#................#",
"#................#",
"#S..............E#",
"########==########",
],
tick(r){mechCrumble(r,21,12);},
},
{
// L3: Bright Tooth — static spikes
name:"Bright Tooth",world:0,
map:[
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#S.....^...^....E#",
"##################",
],
},
{
// L4: Falling Ruler — triggered falling block
name:"Falling Ruler",world:0,
map:[
"#................#",
"#................#",
"#................#",
"#.......B........#",
"#................#",
"#................#",
"#S....!.........E#",
"##################",
],
init(r){
// replace B marker with empty (block is dynamic)
for(let y=0;y<8;y++)for(let x=0;x<18;x++)if(r.map[y][x]==='B')r.map[y][x]='.';
r.timers.push({k:'blk',bx:8*TS,by:3*TS,state:'idle',warn:0,draw:true});
},
tick(r){
const b=r.timers.find(o=>o.k==='blk');
const ptx=Math.floor((r.px+16)/TS);
if(b.state==='idle'&&ptx>=6){b.state='warn';b.warn=15;sfx.trigger();}
if(b.state==='warn'){b.warn--;if(b.warn<=0)b.state='fall';}
if(b.state==='fall'){
 b.by+=7;
 if(b.by>=6*TS-TS){b.by=5*TS;b.state='landed';}
 if(overlap(r.px+4,r.py+4,24,28,b.bx+4,b.by+4,TS-8,TS-8))die();
}
collideBlocks(r);
},
draw(r,cx){drawBlocks(r,cx);},
},
{
// L5: Last Tile — pressure plate opens pit near exit
name:"Last Tile",world:0,
map:[
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#S..............E#",
"##################",
],
init(r){
// plate at x=13, pit opens at x=14 (looks solid initially)
r.timers.push({k:'plate',armed:true});
},
tick(r){
const st=r.timers.find(o=>o.k==='plate');
const ptx=Math.floor((r.px+16)/TS),pty=Math.floor((r.py+32)/TS);
if(st.armed&&pty===6&&ptx===13){
 st.armed=false;
 r.map[7][14]='.'; // pit opens
 sfx.trigger();
}
},
draw(r,cx){
// draw plate hint
const st=r.timers.find(o=>o.k==='plate');
if(st.armed){cx.fillStyle='rgba(122,106,42,.5)';cx.fillRect(13*TS+10,6*TS+TS-8,20,8);}
},
},
{

map:[
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#S...!.....D....E#",
"##################",
],
init(r){
r.def.gates=[{x:11,y:6}];
r.timers.push({k:'gate',t:0});
},
tick(r){
const g=r.timers.find(o=>o.k==='gate');
const ptx=Math.floor((r.px+16)/TS),pty=Math.floor((r.py+16)/TS);
// trigger at x=5
if(pty===6&&ptx===5&&g.t<=0){g.t=108;sfx.trigger();} // 1.8s
if(g.t>0){g.t--;setGate(r,true);}else setGate(r,false);
},
},
{
// L7: Quiet Saw — patrolling blade
name:"Quiet Saw",world:0,
map:[
"#................#",
"#................#",
"#................#",
"#................#",
"#.....####.......#",
"#................#",
"#S..............E#",
"########.#########",
],
init(r){
for(let y=0;y<8;y++)for(let x=0;x<18;x++)if(r.map[y][x]==='~')r.map[y][x]='.';
r.timers.push({k:'saw',x:6*TS,y:5*TS+4,dir:1,pause:0,draw:true});
},
tick(r){
const s=r.timers.find(o=>o.k==='saw');
if(s.pause>0)s.pause--;
else{
 s.x+=1.2*s.dir;
 if(s.x>=10*TS){s.x=10*TS;s.dir=-1;s.pause=42;}
 if(s.x<=6*TS){s.x=6*TS;s.dir=1;s.pause=42;}
}
if(overlap(r.px+6,r.py+6,20,20,s.x+6,s.y+6,28,28))die();
},
draw(r,cx){drawSaws(r,cx);},
},
{
// L8: Paper Door — proximity door + spike under doorway
name:"Paper Door",world:0,
map:[
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#S.....!.....D^.E#",
"##################",
],
init(r){
r.def.gates=[{x:13,y:6}];
r.timers.push({k:'door',open:0});
},
tick(r){
const d=r.timers.find(o=>o.k==='door');
const ptx=Math.floor((r.px+16)/TS);
// plate at x=7: door opens when near, closes after leaving
if(Math.abs(ptx-7)<3){d.open=1;sfx.gate();}
else d.open=0;
setGate(r,d.open===1);
},
},
{
// L9: Decoy Landing — fake floor tile
name:"Decoy Landing",world:0,

"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#S..............E#",
"#######?##########",
],
tick(r){
// ? tile gives way immediately on contact
const ptx=Math.floor((r.px+16)/TS),pty=Math.floor((r.py+32)/TS);
for(let y=0;y<8;y++)for(let x=0;x<18;x++){
 if(r.map[y][x]==='?'&&r.ground&&pty===y&&Math.abs(ptx-x)===0){
  r.map[y][x]='.';sfx.crumble();
 }
}
},
},
{
// L10: Clean Exit — plate shuts door, reveals lower opening, portals
name:"Clean Exit",world:0,
map:[
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#................#",
"#S....!.O...O.^.E#",
"#####.############",
],
init(r){
for(let y=0;y<8;y++)for(let x=0;x<18;x++){
 if(r.map[y][x]==='O')r.map[y][x]='.';
}
r.timers.push({k:'l10',shut:false,
 portals:[{x:8,y:6},{x:12,y:6}]});
},
tick(r){
const st=r.timers.find(o=>o.k==='l10');
const ptx=Math.floor((r.px+16)/TS),pty=Math.floor((r.py+16)/TS);
// plate at x=6 shuts the "door" (blocks upper path) and opens lower
if(!st.shut&&pty===6&&ptx===6){
 st.shut=true;sfx.gate();
 r.map[6][14]='#'; // wall up near exit (snap shut)
 r.map[7][5]='.'; // opening revealed (already .)
}
// portals teleport
for(const p of st.portals){
 if(overlap(r.px,r.py,32,32,p.x*TS+4,p.y*TS+4,TS-8,TS-8)){
  const other=st.portals.find(q=>q!==p);
  r.px=other.x*TS+4;r.py=other.y*TS+4;r.vx=0;r.vy=0;
  sfx.trigger();break;
 }
}
},
draw(r,cx){
const st=r.timers.find(o=>o.k==='l10');
for(const p of st.portals){
 cx.fillStyle='rgba(52,152,219,.6)';
 cx.beginPath();cx.arc(p.x*TS+20,p.y*TS+20,12,0,7);cx.fill();
 cx.fillStyle='rgba(150,200,255,.9)';
 cx.beginPath();cx.arc(p.x*TS+20,p.y*TS+20,6,0,7);cx.fill();
}
},
},
];

}

 // spikes only kill when not safe

// ===== Canvas / scaling =====

  cv.width=LW*S;cv.height=LH*S;cv.style.width=cv.width+'px';cv.style.height=cv.height+'px';
  cx.imageSmoothingEnabled=false;

let AC=null,soundOn=localStorage.getItem('ts_snd')!=='0';
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(f,d,type){if(!soundOn)return;try{const a=ac(),o=a.createOscillator(),g=a.createGain();
o.type=type||'square';o.frequency.value=f;g.gain.value=.06;
g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}
const sfx={
 jump(){beep(320,.08);},die(){beep(140,.25,'sawtooth');},
 win(){beep(523,.1);setTimeout(()=>beep(784,.15),90);},
 crumble(){beep(200,.12,'triangle');},click(){beep(600,.05);},
 trigger(){beep(440,.1,'triangle');},gate(){beep(180,.2,'sawtooth');}
};
document.getElementById('bSound').onclick=e=>{soundOn=!soundOn;
localStorage.setItem('ts_snd',soundOn?'1':'0');e.target.textContent=soundOn?'♪':'✕';};
if(!soundOn)document.getElementById('bSound').textContent='✕';
// ===== Input =====
const keys={};
addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();

}

let LI=parseInt(localStorage.getItem('ts_level')||'0',10);
if(!(LI>=0&&LI<LEVELS.length))LI=0;
let unlocked=parseInt(localStorage.getItem('ts_unlocked')||'0',10);

// ===== Room =====
function loadLevel(i){
 LI=i;localStorage.setItem('ts_level',i);
 const def=LEVELS[i];
 room={
  def,map:def.map.map(r=>r.split('')),
  px:0,py:0,vx:0,vy:0,face:1,ground:false,
  coyote:0,jbuf:0,frame:0,dead:false,win:false,
  timers:[], // per-level dynamic state
 };
 // find spawn
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
  if(room.map[y][x]==='S'){room.px=x*TS+4;room.py=y*TS+8;room.sx=room.px;room.sy=room.py;}
 room.px=room.sx;room.py=room.sy;
 if(def.init)def.init(room);
 document.getElementById('lvl').textContent=(Math.floor(i/10)+1)+'-'+((i%10)+1)+' '+def.name;
 mode='play';
}
function resetRoom(){
 if(!room)return;
 const i=LI;loadLevel(i);
}
function die(){

 room.dead=true;deaths++;sfx.die();
 room.shake=8;

}
function winLevel(){
 if(room.dead||room.win)return;
 room.win=true;sfx.win();
 if(LI+1>unlocked&&LI+1<LEVELS.length){unlocked=LI+1;localStorage.setItem('ts_unlocked',unlocked);}

  if(LI+1<LEVELS.length)loadLevel(LI+1);else showMenu();
 },900);

function findTiles(room,ch){
 const out=[];
 for(let y=0;y<8;y++)for(let x=0;x<18;x++)
  if(room.map[y][x]===ch)out.push({x,y});
 return out;
}

function pTileFeet(r){return {x:Math.floor((r.px+16)/TS),y:Math.floor((r.py+32)/TS)};}

function mechCrumble(room,delay,warnAt){
 delay=delay||21;warnAt=warnAt||12;

 for(const t of findTiles(r,'=')){
  let st=r.timers.find(o=>o.k==='c'+t.x+','+t.y);
  if(!st){st={k:'c'+t.x+','+t.y,t:0,warn:false};r.timers.push(st);}
  const onTile=r.ground&&ft.y===t.y&&ft.x===t.x;
  if(onTile&&r.map[t.y][t.x]==='='){
   st.t++;
   if(st.t>=warnAt&&!st.warn){st.warn=true;sfx.crumble();}
   if(st.t>=delay){r.map[t.y][t.x]='.';sfx.crumble();}
  }else if(!onTile){st.t=0;st.warn=false;}
 }
}
// --- fake floor: '?' vanishes on touch
function mechFakeFloor(room){
 const r=room,ft=pTileFeet(r);
 for(const t of findTiles(r,'?')){
  if(r.ground&&ft.y===t.y&&Math.abs(ft.x-t.x)<1){
   r.map[t.y][t.x]='.';sfx.crumble();
  }
 }
}
// --- falling block object ---
function spawnBlock(room,bx,by){
 const b={k:'blk'+room.timers.length,bx:bx*TS,by:by*TS,state:'idle',warn:0,draw:true};
 room.timers.push(b);return b;
}
function updateBlock(room,b,fallSpeed){
 fallSpeed=fallSpeed||7;
 const r=room;
 if(b.state==='warn'){b.warn--;if(b.warn<=0)b.state='fall';}
 if(b.state==='fall'){
  b.by+=fallSpeed;
  const bty=Math.floor((b.by+TS)/TS);
  for(let tx=Math.floor(b.bx/TS);tx<=Math.floor((b.bx+TS-1)/TS);tx++){
   const t=(room.map[bty]&&room.map[bty][tx])||'#';
   if(t==='#'||t==='='){b.by=bty*TS-TS;b.state='landed';break;}
  }
  if(b.state==='fall'&&b.by>LH)b.state='gone';
  if(overlap(r.px+4,r.py+4,24,28,b.bx+4,b.by+4,TS-8,TS-8))die();
 }
}
function drawBlocks(room,cx){
 for(const b of room.timers){
  if(!b.draw||!b.k.startsWith('blk'))continue;
  if(b.state==='gone')continue;
  if(b.state==='warn'&&Math.floor(room.frame/4)%2===0)cx.fillStyle='#8a6a2a';
  else cx.fillStyle='#5a4a6a';
  cx.fillRect(b.bx,b.by,TS,TS);
  cx.fillStyle='#7a5a8a';cx.fillRect(b.bx,b.by,TS,4);
 }
}
function collideBlocks(room){
 for(const b of room.timers){
  if(!b.draw||!b.k.startsWith('blk'))continue;
  if(b.state!=='landed'&&b.state!=='fall')continue;
  const r=room;
  if(overlap(r.px,r.py,32,32,b.bx,b.by,TS,TS)){
   const dx1=(b.bx+TS)-r.px,dx2=(r.px+32)-b.bx;
   const dy1=(b.by+TS)-r.py,dy2=(r.py+32)-b.by;
   const m=Math.min(dx1,dx2,dy1,dy2);
   if(m===dy2){r.py=b.by-32;r.vy=0;r.ground=true;}
   else if(m===dy1){r.py=b.by+TS;r.vy=Math.max(r.vy,0);}
   else if(m===dx1){r.px=b.bx-32;r.vx=0;}
   else{r.px=b.bx+TS;r.vx=0;}
  }
 }
}
// --- saw ---
function spawnSaw(room,x,y){
 const s={k:'saw'+room.timers.length,x:x*TS,y:y*TS,dir:1,pause:0,draw:true,saw:true};
 room.timers.push(s);return s;
}
function updateSaw(room,s,x1,x2,speed,pauseF){
 pauseF=pauseF===undefined?42:pauseF;
 if(s.pause>0)s.pause--;
 else{
  s.x+=speed*s.dir;
  if(s.x>=x2*TS){s.x=x2*TS;s.dir=-1;s.pause=pauseF;}
  if(s.x<=x1*TS){s.x=x1*TS;s.dir=1;s.pause=pauseF;}
 }
 if(overlap(room.px+6,room.py+6,20,20,s.x+6,s.y+6,28,28))die();
}
function drawSaws(room,cx){
 for(const s of room.timers){
  if(!s.saw)continue;
  cx.save();cx.translate(s.x+20,s.y+20);cx.rotate(room.frame/8);
  cx.fillStyle='#c0c0c0';
  for(let i=0;i<8;i++){cx.rotate(Math.PI/4);
   cx.beginPath();cx.moveTo(0,0);cx.lineTo(16,-5);cx.lineTo(16,5);cx.fill();}
  cx.fillStyle='#e74c3c';cx.beginPath();cx.arc(0,0,6,0,7);cx.fill();
  cx.restore();
 }
}
// --- gate ---
function setGate(room,open){
 for(let y=0;y<8;y++)for(let x=0;x<18;x++)
  if(room.def.gates&&room.def.gates.some(g=>g.x===x&&g.y===y))
   room.map[y][x]=open?'.':'D';
}
// --- lift (moving platform) ---
function spawnLift(room,x1,y1,x2,y2,speed,pauseF){
 const l={k:'lift'+room.timers.length,x:x1*TS,y:y1*TS,
  x1:x1*TS,y1:y1*TS,x2:x2*TS,y2:y2*TS,dir:1,speed:speed||1,pause:0,pauseF:pauseF||30,
  draw:true,lift:true,px:0,py:0};
 room.timers.push(l);return l;
}
function updateLift(room,l){
 const r=room;
 l.px=l.x;l.py=l.y;
 if(l.pause>0)l.pause--;
 else{
  const dx=l.x2-l.x1,dy=l.y2-l.y1;
  const dist=Math.hypot(dx,dy)||1;
  l.x+=dx/dist*l.speed*l.dir;l.y+=dy/dist*l.speed*l.dir;
  const t=((l.x-l.x1)*dx+(l.y-l.y1)*dy)/(dist*dist);
  if(t>=1||t<=0){l.dir*=-1;l.pause=l.pauseF;
   l.x=Math.max(Math.min(l.x,l.x1,l.x2),Math.min(l.x1,l.x2));
   l.y=Math.max(Math.min(l.y,l.y1,l.y2),Math.min(l.y1,l.y2));}
 }
 // carry player
 const dx=l.x-l.px,dy=l.y-l.py;
 if(r.ground&&overlap(r.px,r.py+30,32,6,l.x,l.y,TS,20)){
  r.px+=dx;r.py+=dy;
 }
 // stand on lift
 if(overlap(r.px+4,r.py+28,24,8,l.x,l.y,TS,16)&&r.vy>=0){
  r.py=l.y-32;r.vy=0;r.ground=true;
 }
}
function drawLifts(room,cx){
 for(const l of room.timers){
  if(!l.lift)continue;
  cx.fillStyle='#3a5a7a';cx.fillRect(l.x,l.y,TS,16);
  cx.fillStyle='#5a8aaa';cx.fillRect(l.x,l.y,TS,3);
 }
}
// --- wind zone ---
function applyWind(room,zones){
 // zones: [{x1,y1,x2,y2,dx,dy}]
 const r=room;
 for(const z of zones){
  if(r.px+16>z.x1*TS&&r.px+16<z.x2*TS&&r.py+16>z.y1*TS&&r.py+16<z.y2*TS){
   r.vx+=z.dx;r.vy+=z.dy;
   r.vx=Math.max(-4,Math.min(4,r.vx));
  }
 }
}
function drawWind(room,cx,zones){
 for(const z of zones){
  cx.fillStyle='rgba(150,200,255,.12)';
  cx.fillRect(z.x1*TS,z.y1*TS,(z.x2-z.x1)*TS,(z.y2-z.y1)*TS);
  // animated streaks
  cx.fillStyle='rgba(150,200,255,.3)';
  const off=(room.frame*2)%40;
  for(let i=0;i<3;i++){
   const sy=z.y1*TS+((i*40+off)%((z.y2-z.y1)*TS));
   if(z.dx>0)cx.fillRect(z.x1*TS+((room.frame*3+i*60)%((z.x2-z.x1)*TS)),sy,20,2);
   else if(z.dy<0)cx.fillRect(z.x1*TS+i*((z.x2-z.x1)*TS/3),sy,2,16);
  }
 }
}
// --- water (slow + can't jump as high) ---
function applyWater(room,tiles){
 const r=room,ft=pTile(r);
 for(const t of tiles){
  if(ft.x===t.x&&ft.y===t.y){
   r.vx*=0.92;r.vy=Math.min(r.vy,3);
  }
 }
}
// --- gravity zone ---
function applyGravityZone(room,zones){
 const r=room,pt=pTile(r);
 for(const z of zones){
  if(pt.x>=z.x1&&pt.x<=z.x2&&pt.y>=z.y1&&pt.y<=z.y2){
   r.gravFlip=true;return;
  }
 }
 r.gravFlip=false;
}
function tileAt(tx,ty){
 if(tx<0||tx>=COLS||ty<0||ty>=ROWS)return '#';
 return room.map[ty][tx];
}
function solidAt(tx,ty){
 const t=tileAt(tx,ty);
 return t==='#'||t==='='||t==='?'||t==='D';
}
// ===== Physics step =====
function step(){
 const r=room;r.frame++;
 const L=keys.ArrowLeft||keys.KeyA,R=keys.ArrowRight||keys.KeyD;
 const J=keys.ArrowUp||keys.KeyW||keys.Space;
 // horizontal
 const acc=r.ground?0.6:0.4;
 if(L){r.vx=Math.max(r.vx-acc,-MOVE);r.face=-1;}
 else if(R){r.vx=Math.min(r.vx+acc,MOVE);r.face=1;}
 else{r.vx*=r.ground?0.7:0.96;if(Math.abs(r.vx)<0.05)r.vx=0;}
 // per-level pre-physics (wind, currents, gravity fields...)
 if(r.def.pre)r.def.pre(r);
 // jump
 if(J&&!r.jheld){r.jbuf=JBUF;r.jheld=true;}
 if(!J)r.jheld=false;
 if(r.jbuf>0)r.jbuf--;
 if(r.ground)r.coyote=COYOTE;else if(r.coyote>0)r.coyote--;
 if(r.jbuf>0&&r.coyote>0){
  r.vy=JUMP_V;r.ground=false;r.coyote=0;r.jbuf=0;sfx.jump();
  if(r.def.onJump)r.def.onJump(r);
 }
 // gravity
 r.vy=Math.min(r.vy+GRAV,MAXFALL);
 // move X
 r.px+=r.vx;
 collideX(r);
 // move Y
 r.py+=r.vy;
 r.ground=false;
 collideY(r);
 // per-level post-physics (traps, hazards, triggers...)
 if(r.def.tick)r.def.tick(r);
 // hazards & exit check
 checkHazards(r);
 if(r.py>LH+60)die(); // fell out
 if(r.shake>0)r.shake*=0.85;
}
const PW=TS-8,PH=TS-8;
function collideX(r){
 const y0=Math.floor(r.py/TS),y1=Math.floor((r.py+PH-1)/TS);
 if(r.vx>0){
  const tx=Math.floor((r.px+PW)/TS);
  for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){r.px=tx*TS-PW-0.01;r.vx=0;break;}
 }else if(r.vx<0){
  const tx=Math.floor(r.px/TS);
  for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){r.px=(tx+1)*TS+0.01;r.vx=0;break;}
 }
}
function collideY(r){
 const x0=Math.floor((r.px+2)/TS),x1=Math.floor((r.px+PW-2)/TS);
 if(r.vy>0){
  const ty=Math.floor((r.py+PH)/TS);
  for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){
   r.py=ty*TS-PH;r.vy=0;r.ground=true;
   if(r.def.onLand)r.def.onLand(r,tx,ty);
   break;}
 }else if(r.vy<0){
  const ty=Math.floor(r.py/TS);
  for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){r.py=(ty+1)*TS+0.01;r.vy=0;break;}
 }
}
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
 return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}
function checkHazards(r){
 const x0=Math.floor(r.px/TS),x1=Math.floor((r.px+PW)/TS);
 const y0=Math.floor(r.py/TS),y1=Math.floor((r.py+PH)/TS);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
  const t=tileAt(tx,ty);
  if(t==='^'){ // spikes — shrink hitbox a bit for fairness
   if(overlap(r.px+6,r.py+10,PW-12,PH-10,tx*TS+6,ty*TS+14,TS-12,TS-14)){die();return;}
  }
  if(t==='E'){ // exit
   if(overlap(r.px,r.py,PW,PH,tx*TS+4,ty*TS+4,TS-8,TS-8)){winLevel();return;}
  }
 }
}
// ===== Rendering =====
const TILE_COLORS={'#':'#232c44','=':'#4a3b22','?':'#2a3f2a','D':'#5a2a2a'};
function draw(){
 cx.save();cx.scale(S,S);
 if(room&&room.shake>0.3)cx.translate((Math.random()-.5)*room.shake,(Math.random()-.5)*room.shake);
 cx.fillStyle='#0b0e17';cx.fillRect(0,0,LW,LH);
 if(mode==='menu'){drawMenu();cx.restore();return;}
 const r=room;
 // tiles
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  const t=r.map[y][x],px=x*TS,py=y*TS;
  if(t==='#'){cx.fillStyle='#232c44';cx.fillRect(px,py,TS,TS);
   cx.fillStyle='#2e3a58';cx.fillRect(px,py,TS,3);}
  else if(t==='='){ // crumble — color shifts as timer runs
   const key=x+','+y,ct=r.timers.find(o=>o.k===key);
   let c='#4a3b22';
   if(ct&&ct.warn)c='#8a5a22';
   cx.fillStyle=c;cx.fillRect(px,py,TS,TS);
   cx.fillStyle='#6a532f';cx.fillRect(px,py,TS,3);
   // cracks
   cx.fillStyle='rgba(0,0,0,.3)';
   if(ct&&ct.warn){cx.fillRect(px+8,py+10,3,20);cx.fillRect(px+22,py+8,3,22);}
  }
  else if(t==='?'){cx.fillStyle='#2a3f4a';cx.fillRect(px,py,TS,TS);
   cx.fillStyle='#3ddc84';cx.fillRect(px,py,TS,3);}
  else if(t==='^'){cx.fillStyle='#c0392b';
   for(let s=0;s<4;s++){const sx=px+s*10;
    cx.beginPath();cx.moveTo(sx,py+TS);cx.lineTo(sx+5,py+8);cx.lineTo(sx+10,py+TS);cx.fill();}}
  else if(t==='D'){cx.fillStyle='#5a2a2a';cx.fillRect(px,py,TS,TS);
   cx.fillStyle='#8a3a3a';cx.fillRect(px+4,py+4,TS-8,TS-8);}
  else if(t==='!'){cx.fillStyle='#7a6a2a';cx.fillRect(px+10,py+TS-8,20,8);}
  else if(t==='K'){cx.fillStyle='#f1c40f';cx.fillRect(px+14,py+10,12,12);}
  else if(t==='E'){
   // exit portal — mysterious, no text
   const pl=0.7+0.3*Math.sin(r.frame/20);
   cx.fillStyle=`rgba(155,89,182,${0.25*pl})`;
   cx.beginPath();cx.arc(px+TS/2,py+TS/2,16,0,7);cx.fill();
   cx.fillStyle=`rgba(200,140,230,${0.8*pl})`;
   cx.beginPath();cx.arc(px+TS/2,py+TS/2,9,0,7);cx.fill();
  }
  else if(t==='S'){/* spawn marker subtle */}
 }
 // per-level custom draw (blocks, saws, wind, etc.)
 if(r.def.draw)r.def.draw(r,cx);
 // player — WISP
 const px=r.px,py=r.py;
 const bob=Math.sin(r.frame/8)*2;
 cx.fillStyle='#39d0d8';
 cx.fillRect(px+8,py+6+bob*0.3,16,14);
 cx.fillStyle='#7df9ff';
 cx.fillRect(px+11,py+9+bob*0.3,5,5); // eye
 cx.fillStyle='rgba(57,208,216,.35)';
 cx.fillRect(px+4,py+10+bob*0.3,4,8);
 cx.fillRect(px+20,py+10+bob*0.3,4,8);
 // win flash
 if(r.win){cx.fillStyle=`rgba(255,255,255,${0.5})`;cx.fillRect(0,0,LW,LH);}
 cx.restore();
}
// ===== Menu =====
function drawMenu(){
 cx.fillStyle='#0b0e17';cx.fillRect(0,0,LW,LH);
 cx.textAlign='center';
 cx.fillStyle='#e8eefc';cx.font='bold 44px Courier New';
 cx.fillText('TRAPSTEP',LW/2,70);
 cx.fillStyle='#c0392b';cx.font='bold 20px Courier New';
 cx.fillText('THE UNRELIABLE FLOOR',LW/2,100);
 cx.fillStyle='#8fa3c7';cx.font='14px Courier New';
 cx.fillText('TRUST NOTHING',LW/2,126);
 // world select grid — simplified: level buttons
 const per=18,bw=32,bh=26,gx=(LW-per*(bw+4))/2;
 cx.font='11px Courier New';
 for(let i=0;i<LEVELS.length;i++){
  const wx=gx+(i%per)*(bw+4),wy=150+Math.floor(i/per)*(bh+4);
  const locked=i>unlocked;
  cx.fillStyle=locked?'#1a2030':(i===LI?'#2a5a3a':'#232c44');
  cx.fillRect(wx,wy,bw,bh);
  cx.fillStyle=locked?'#3a4a5e':'#cfe0ff';
  cx.fillText(i+1,wx+bw/2,wy+17);
 }
 cx.fillStyle='#8fa3c7';cx.font='13px Courier New';
 cx.fillText('TAP A LEVEL — ARROWS/WASD MOVE · SPACE JUMP · R RETRY',LW/2,LH-24);
}
let menuClick={x:0,y:0};
cv.addEventListener('pointerdown',e=>{
 const rect=cv.getBoundingClientRect();
 const x=(e.clientX-rect.left)/S,y=(e.clientY-rect.top)/S;
 if(mode==='menu'){
  const per=18,bw=32,bh=26,gx=(LW-per*(bw+4))/2;
  for(let i=0;i<LEVELS.length;i++){
   const wx=gx+(i%per)*(bw+4),wy=150+Math.floor(i/per)*(bh+4);
   if(x>wx&&x<wx+bw&&y>wy&&y<wy+bh&&i<=unlocked){sfx.click();loadLevel(i);return;}
  }
 }
});
document.getElementById('bMenu').onclick=()=>showMenu();
function showMenu(){mode='menu';}
document.addEventListener('visibilitychange',()=>{if(document.hidden)for(const k in keys)keys[k]=false;});
// ===== Main loop =====
let last=0;
function loop(t){
 requestAnimationFrame(loop);
 if(t-last<16.6)return;last=t;
 if(mode==='play'&&room&&!room.dead)step();
 draw();
}
showMenu();
requestAnimationFrame(loop);
</script></body></html>
