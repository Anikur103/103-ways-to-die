else{g.vx*=g.ground?0.72:0.96;if(Math.abs(g.vx)<0.06)g.vx=0;}
// jump buffer + coyote
if(J&&!g.jh){g.jbuf=6;g.jh=true;}if(!J)g.jh=false;
if(g.jbuf>0)g.jbuf--;if(g.ground)g.coy=6;else if(g.coy>0)g.coy--;
if(g.jbuf>0&&g.coy>0){g.vy=JV;g.ground=false;g.coy=0;g.jbuf=0;sfx.jump();}
// gravity
g.vy=Math.min(g.vy+GR,MF);
// X
g.px+=g.vx;
let hb={x:g.px+2,y:g.py+2,w:14,h:22};
if(g.vx>0){for(let y=hb.y;y<hb.y+hb.h;y+=6)
if(solid(hb.x+hb.w,y)){g.px=Math.floor((hb.x+hb.w)/1)-16;g.vx=0;break;}}
else if(g.vx<0){for(let y=hb.y;y<hb.y+hb.h;y+=6)
if(solid(hb.x,y)){g.px=Math.ceil(hb.x/1)+1-2;g.vx=0;break;}}
// Y
g.py+=g.vy;g.ground=false;
hb={x:g.px+2,y:g.py+2,w:14,h:22};
if(g.vy>=0){const yy=hb.y+hb.h;
for(let x=hb.x;x<hb.x+hb.w;x+=6)if(solid(x,yy)){g.py=Math.floor(yy/1)-24;
g.vy=0;g.ground=true;break;}}
else{for(let x=hb.x;x<hb.x+hb.w;x+=6)if(solid(x,hb.y)){
g.py=Math.ceil(hb.y/1)+1-2;g.vy=0;break;}}
// traps
traps();
// portal
const pcx=g.px+9,pcy=g.py+13;
const gl=g.d.g;
if(Math.abs(pcx-(gl.x+10))<14&&Math.abs(pcy-(gl.y+10))<20)win();
// fell out
if(g.py>H+40)die();
if(g.shake>0)g.shake*=0.86;
}
function traps(){
const g=G,pcx=g.px+9;
for(const t of g.ts){
if(t.t==='pit'){
if(!t.active&&!t.gone&&pcx>t.trig){t.active=true;t.timer=14;sfx.trig();}}
else if(t.t==='spike'){
if(!t.active&&Math.abs(pcx-(t.x+t.w/2))<t.trig){t.active=true;t.timer=10;sfx.trig();}}
else if(t.t==='fall'){
if(!t.active&&!t.gone){
const p=g.plats[t.pi];
if(p&&g.ground&&g.px+9>p.x&&g.px+9<p.x+p.w&&g.py+24>=p.y&&g.py+24<=p.y+12){
t.active=true;t.timer=t.warn||25;sfx.trig();}}}
else if(t.t==='drop'){
if(!t.active&&pcx>t.x-40&&pcx<t.x+40){t.active=true;sfx.trig();}}
else if(t.t==='saw'||t.t==='fake')t.active=true;
// update
if(t.t==='pit'&&t.active&&!t.gone){t.timer--;if(t.timer<=0){t.gone=true;
g.plats=g.plats.filter((p,i)=>i!==t.pi);}}
if(t.t==='spike'&&t.active){t.timer--;
if(t.timer<=0){// lethal
if(pcx>t.x-2&&pcx<t.x+t.w+2&&g.py+24>t.y-24&&g.py<t.y+10)die();}}
if(t.t==='fall'&&t.active&&!t.gone){t.timer--;
if(t.timer<=0){t.gone=true;g.plats=g.plats.filter((p,i)=>i!==t.pi);}}
if(t.t==='drop'&&t.active){
if(t.sy===undefined){t.sy=-40;}
t.sy+=6.5;
const p=g.plats.find(p=>t.sx>p.x-10&&t.sx<p.x+p.w+10&&p.y>40);
const floorY=p?p.y:H+40;
if(t.sy+t.h>=floorY){t.sy=floorY-t.h;t.active=false;t.landed=true;}
if(Math.abs(pcx-(t.sx+17))<22&&Math.abs((g.py+13)-(t.sy+17))<24)die();}
if(t.t==='saw'){
t.sx+=t.dx;
if(t.sx<t.x1){t.sx=t.x1;t.dx=Math.abs(t.dx);}
if(t.sx>t.x2){t.sx=t.x2;t.dx=-Math.abs(t.dx);}
if(Math.abs(pcx-(t.sx+14))<18&&Math.abs((g.py+13)-(t.sy+14))<18)die();}
if(t.t==='fake'){
if(Math.abs(pcx-(t.x+10))<16&&Math.abs((g.py+13)-(t.y+10))<22)die();}
}
}
// ---------- render ----------
function draw(){
cx.save();cx.scale(S,S);
// gradient bg with stars
const bgG=cx.createLinearGradient(0,0,0,H);
bgG.addColorStop(0,'#0a0e1a');bgG.addColorStop(1,'#111827');
cx.fillStyle=bgG;cx.fillRect(0,0,W,H);
cx.fillStyle='rgba(255,255,255,.4)';
for(let i=0;i<35;i++){const sx=(i*97)%W,sy=(i*57)%H;
cx.globalAlpha=0.15+0.15*Math.sin((G?G.fr:0)/30+i);cx.fillRect(sx,sy,2,2);}
cx.globalAlpha=1;
if(mode==='menu'){menu();cx.restore();return;}
const g=G;
if(g.shake>0.3)cx.translate((Math.random()-.5)*g.shake,(Math.random()-.5)*g.shake);
// platforms
const vp=mergePlats(g);
for(const p of vp){
cx.fillStyle='#1e293b';cx.fillRect(p.x,p.y,p.w,p.h);
cx.fillStyle='#334155';cx.fillRect(p.x,p.y,p.w,5);
cx.fillStyle='#0f172a';cx.fillRect(p.x,p.y+p.h-4,p.w,4);
cx.fillStyle='#5eead4';cx.fillRect(p.x,p.y,p.w,2);
if(p.warn){cx.fillStyle='rgba(255,180,60,.45)';cx.fillRect(p.x,p.y,p.w,p.h);}}
// spikes
for(const t of g.ts){if(t.t!=='spike'||!t.active||t.timer>0)continue;
for(let s=0;s<t.w/10;s++){const sx=t.x+s*10;
const sg=cx.createLinearGradient(sx,0,sx+10,0);
sg.addColorStop(0,'#991b1b');sg.addColorStop(.5,'#ef4444');sg.addColorStop(1,'#991b1b');
cx.fillStyle=sg;
cx.beginPath();cx.moveTo(sx,t.y);cx.lineTo(sx+5,t.y-24);cx.lineTo(sx+10,t.y);cx.fill();}
cx.fillStyle='#7f1d1d';cx.fillRect(t.x-2,t.y-2,t.w+4,4);}
// falling blocks
for(const t of g.ts){if(t.t!=='drop')continue;
if(t.sy===undefined||t.sy<-30)continue;
cx.fillStyle='#4a3b5a';cx.fillRect(t.sx,t.sy,t.w,t.h);
cx.fillStyle='#6a5a7a';cx.fillRect(t.sx,t.sy,t.w,4);
cx.fillStyle='#3a2b4a';cx.fillRect(t.sx,t.sy+t.h-4,t.w,4);}
// saws
for(const t of g.ts){if(t.t!=='saw')continue;
cx.save();cx.translate(t.sx+14,t.sy+14);cx.rotate(g.fr/7);
cx.fillStyle='#c8c8d0';
for(let i=0;i<8;i++){cx.rotate(Math.PI/4);
cx.beginPath();cx.moveTo(0,0);cx.lineTo(15,-4);cx.lineTo(15,4);cx.fill();}
cx.fillStyle='#e74c3c';cx.beginPath();cx.arc(0,0,5,0,7);cx.fill();cx.restore();}
// portal gate (and fakes look identical)
const gl=g.d.g,pp=0.6+0.4*Math.sin(g.fr/16);
function gate(x,y){
cx.fillStyle='#334155';cx.fillRect(x-4,y-10,28,54);
cx.fillStyle='#1e293b';cx.fillRect(x-2,y-8,24,50);
const pg=cx.createRadialGradient(x+10,y+17,2,x+10,y+17,14);
pg.addColorStop(0,'rgba(196,141,255,'+(0.95*pp)+')');
pg.addColorStop(.6,'rgba(139,92,246,'+(0.7*pp)+')');
pg.addColorStop(1,'rgba(76,29,149,'+(0.3*pp)+')');
cx.fillStyle=pg;
cx.beginPath();cx.ellipse(x+10,y+17,9,15,0,0,7);cx.fill();
cx.strokeStyle='rgba(255,255,255,'+(0.5*pp)+')';cx.lineWidth=1.5;
for(let s=0;s<2;s++){const sa=g.fr/20+s*3.14;
cx.beginPath();cx.ellipse(x+10,y+17,5,10,sa*0.3,0,7);cx.stroke();}}
gate(gl.x,gl.y);
for(const t of g.ts){if(t.t!=='fake')continue;gate(t.x,t.y);}
// player
const px=g.px,py=g.py;
if(!g.dead){
const pg2=cx.createRadialGradient(px+9,py+12,2,px+9,py+12,20);
pg2.addColorStop(0,'rgba(94,234,212,.35)');pg2.addColorStop(1,'rgba(94,234,212,0)');
cx.fillStyle=pg2;cx.fillRect(px-11,py-8,40,40);
const sq=g.ground?1:1+Math.min(0.12,Math.abs(g.vy)*0.012);
const bw=14/sq,bh=20*sq;
cx.fillStyle='#5eead4';
cx.fillRect(px+9-bw/2,py+22-bh,bw,bh);
cx.fillStyle='#a7f3d0';cx.fillRect(px+9-bw/2,py+22-bh,bw,5);
const ex=g.face*2;
cx.fillStyle='#0f172a';
cx.fillRect(px+5+ex,py+8,3.5,5);cx.fillRect(px+10+ex,py+8,3.5,5);
cx.fillStyle='#fff';
cx.fillRect(px+6+ex,py+9,1.5,1.5);cx.fillRect(px+11+ex,py+9,1.5,1.5);}
if(g.win){cx.fillStyle='rgba(255,255,255,.45)';cx.fillRect(0,0,W,H);}
cx.restore();
}
function mergePlats(g){
// merge adjacent same-y platforms visually (hides pit seams)
const ps=[...g.plats].sort((a,b)=>a.y-b.y||a.x-b.x);
const out=[];let run=null;
for(const p of ps){
const ti=g.d.traps.findIndex(t=>(t.t==='pit'||t.t==='fall')&&g.d.p[t.pi]===p);
const t=ti>=0?g.ts[ti]:null;
const gone=t&&(t.gone||(t.active&&t.t==='pit'));
if(gone){if(run){out.push(run);run=null;}continue;}
let warn=false;
if(t&&t.t==='fall'&&t.active)warn=true;
if(run&&!warn&&!run.warn&&run.y===p.y&&p.x<=run.x+run.w+1){
run.w=Math.max(run.x+run.w,p.x+p.w)-run.x;
}else{if(run)out.push(run);run={x:p.x,y:p.y,w:p.w,h:p.h,warn};}}
if(run)out.push(run);
return out;
}
function menu(){
cx.textAlign='center';
cx.fillStyle='#fff';cx.font='bold 40px Courier New';
cx.fillText('103 WAYS TO DIE',W/2,58);
cx.fillStyle='#dc2626';cx.font='bold 15px Courier New';
cx.fillText('TRUST NOTHING',W/2,84);
const per=13,bw=30,bh=24;
const gx=(W-per*(bw+5))/2;let y=110;
cx.font='11px Courier New';
for(let i=0;i<LEVELS.length;i++){
const x=gx+(i%per)*(bw+5);if(i%per===0&&i>0)y+=bh+5;
const lk=i>UN;
cx.fillStyle=lk?'#141a28':(i===LI?'#1e4a2e':'#232c44');
cx.fillRect(x,y,bw,bh);
if(i<=UN){cx.fillStyle=i===LI?'#7df9ff':'#8fa3c7';cx.fillText(i+1,x+bw/2,y+16);}}
cx.fillStyle='#5a6a8a';cx.font='11px Courier New';
cx.fillText('ARROWS/WASD MOVE · SPACE JUMP · R RETRY',W/2,H-14);
}
cv.addEventListener('pointerdown',e=>{
if(mode!=='menu')return;
const r=cv.getBoundingClientRect();
const x=(e.clientX-r.left)/S,y=(e.clientY-r.top)/S;
const per=13,bw=30,bh=24,gx=(W-per*(bw+5))/2;let yy=110;
for(let i=0;i<LEVELS.length;i++){
const xx=gx+(i%per)*(bw+5);if(i%per===0&&i>0)yy+=bh+5;
if(x>xx&&x<xx+bw&&y>yy&&y<yy+bh&&i<=UN){sfx.trig();newGame(i);return;}}
});
document.getElementById('bM').onclick=()=>{mode='menu';};
function toMenu(){mode='menu';}
// ---------- loop ----------
let last=0;
function loop(t){requestAnimationFrame(loop);
if(t-last<16.6)return;last=t;
if(mode==='play'&&G&&!G.dead)move();
draw();}
toMenu();requestAnimationFrame(loop);
</script></body></html>
