<script>
"use strict";
/* ================================================================
   ENGINE — pure logic, zero DOM. Mirrored 1:1 by bot.py for QA.
================================================================ */
/*ENGINE_START*/
const TILE=40, COLS=24, ROWS=14, VW=960, VH=560;
const GRAV=2600, MOVE=280, ACCG=3400, ACCA=2400, JUMPV=750, MAXFALL=920;
const COYOTE=0.10, BUFFER=0.10, RELGRAV=2.6;
const PW=22, PH=26;
const DEF_D={pit:0.22, spike:0.32, crumble:0.50, block:0.25};

function solidAt(g,tx,ty){
  if(tx<0||tx>=COLS) return true;
  if(ty<0||ty>=ROWS) return false;
  return g[ty*COLS+tx]===1;
}
function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function mkDoor(tx,ty){ return {x:tx*TILE+4, y:ty*TILE-16, w:32, h:56}; }

function parseLevel(def){
  const g=new Uint8Array(COLS*ROWS);
  const L={grid:g, spawn:null, exits:[], runners:[], fakes:[], ghosts:[],
           pits:[], spikes:[], fspikes:[], crumbles:[], blinks:[], blocks:[],
           saws:[], chasers:[], doors:[], zones:[], buttons:[]};
  const D=Object.assign({}, DEF_D, def.d||{});
  L.D=D;
  const ralts=def.ralt||[];
  let ri=0;
  for(let y=0;y<ROWS;y++){
    const row=def.map[y]||"";
    for(let x=0;x<COLS;x++){
      const c=row[x]||".", i=y*COLS+x, cx=x*TILE+TILE/2, cy=y*TILE+TILE/2;
      if(c==="#"){ g[i]=1; }
      else if(c==="W"){ g[i]=1; }
      else if(c==="G"){ L.ghosts.push({tx:x,ty:y}); }
      else if(c==="P"){ L.spawn={x:cx, y:cy}; }
      else if(c==="E"){ L.exits.push(mkDoor(x,y)); }
      else if(c==="R"){ const r=mkDoor(x,y); r.moved=false;
        const a=ralts[ri++]||[x,y]; r.ax=a[0]; r.ay=a[1]; L.runners.push(r); }
      else if(c==="X"){ L.fakes.push(mkDoor(x,y)); }
      else if(c==="D"){ g[i]=1; L.doors.push({tx:x,ty:y,st:0,pair:L.doors.length}); }
      else if(c==="Z"){ L.zones.push({tx:x,ty:y,pair:L.zones.length,used:false}); }
      else if(c==="T"){ g[i]=1; L.buttons.push({tx:x,ty:y,pair:L.buttons.length,used:false}); }
      else if(c==="H"){ g[i]=1; L.pits.push({tx:x,ty:y,st:0,t:0}); }
      else if(c==="^"){ L.spikes.push({x:cx,y:cy,st:0,t:0}); }
      else if(c==="n"){ L.fspikes.push({x:cx,y:cy}); }
      else if(c==="v"){ L.spikes.push({x:cx,y:cy,st:3,t:0}); }
      else if(c==="*"){ g[i]=1; L.crumbles.push({tx:x,ty:y,st:0,t:0}); }
      else if(c===":"){ g[i]=1; L.blinks.push({tx:x,ty:y,t:0}); }
      else if(c==="B"){ L.blocks.push({x:x*TILE,y:y*TILE,w:TILE,h:TILE,st:0,t:0,vy:0}); }
      else if(c==="s"||c==="S"){ L.saws.push({x:cx,y:cy,ax:(c==="s"?"h":"v"),dir:1,spd:(def.saw||150),min:0,max:0}); }
      else if(c==="c"){ L.chasers.push({x:cx,y:cy,min:0,max:0}); }
    }
  }
  const setRange=(s)=>{
    const stx=Math.floor(s.x/TILE), sty=Math.floor(s.y/TILE);
    let a,b;
    if(s.ax==="v"){
      a=sty; while(a>0 && !solidAt(g,stx,a-1)) a--;
      b=sty; while(b<ROWS-1 && !solidAt(g,stx,b+1)) b++;
    }else{
      a=stx; while(a>0 && !solidAt(g,a-1,sty)) a--;
      b=stx; while(b<COLS-1 && !solidAt(g,b+1,sty)) b++;
    }
    s.min=a*TILE+TILE/2; s.max=b*TILE+TILE/2;
    if(s.max<=s.min){ s.min=(s.ax==="v"?s.y:s.x)-40; s.max=(s.ax==="v"?s.y:s.x)+40; }
  };
  for(const s of L.saws) setRange(s);
  for(const s of L.chasers) setRange(s);
  return L;
}

function newGameState(def){
  const L=parseLevel(def);
  return { L:L, p:{x:L.spawn.x-PW/2, y:L.spawn.y-PH/2, vx:0, vy:0,
                   grounded:false, coyote:0, buffer:0, face:1, hidden:false},
           time:0, outcome:null, cause:"" };
}

function collideAxis(S, axis){
  const p=S.p, g=S.L.grid;
  const x0=Math.floor(p.x/TILE), x1=Math.floor((p.x+PW-1)/TILE);
  const y0=Math.floor(p.y/TILE), y1=Math.floor((p.y+PH-1)/TILE);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    if(!solidAt(g,tx,ty)) continue;
    if(axis===0){
      if(p.vx>0) p.x=tx*TILE-PW; else if(p.vx<0) p.x=(tx+1)*TILE;
      p.vx=0;
    }else{
      if(p.vy>0){ p.y=ty*TILE-PH; p.vy=0; p.grounded=true; }
      else if(p.vy<0){ p.y=(ty+1)*TILE; p.vy=0; }
    }
  }
}

function openDoor(S,d){
  if(d.st===1) return;
  d.st=1; S.L.grid[d.ty*COLS+d.tx]=0; S.doorOpened=d;
}
function updateTraps(S,dt){
  const L=S.L, D=L.D, p=S.p;
  const pcx=p.x+PW/2, pcy=p.y+PH/2;
  const prect={x:p.x,y:p.y,w:PW,h:PH};
  const footTX=Math.floor(pcx/TILE), footTY=Math.floor((p.y+PH+2)/TILE);
  for(const o of L.pits){
    if(o.st===2) continue;
    if(o.st===0 && p.grounded && footTX===o.tx && footTY===o.ty){ o.st=1; o.t=D.pit; }
    else if(o.st===1){ o.t-=dt; if(o.t<=0){ o.st=2; L.grid[o.ty*COLS+o.tx]=0; } }
  }
  for(const o of L.crumbles){
    if(o.st===2) continue;
    if(o.st===0 && p.grounded && footTX===o.tx && footTY===o.ty){ o.st=1; o.t=D.crumble; }
    else if(o.st===1){ o.t-=dt; if(o.t<=0){ o.st=2; L.grid[o.ty*COLS+o.tx]=0; } }
  }
  for(const o of L.blinks){
    o.t+=dt;
    const on=(o.t%2.2)<1.1, cur=L.grid[o.ty*COLS+o.tx]===1;
    if(on!==cur) L.grid[o.ty*COLS+o.tx]=on?1:0;
  }
  /* pop-up spikes: hidden -> warn -> erupted (kills 0.3s) -> walkable ridge */
  for(const o of L.spikes){
    if(o.st===4) continue;
    if(o.st===3){ const r={x:o.x-15,y:o.y+6,w:30,h:14};
      if(rectsOverlap(prect,r)){ S.outcome="dead"; S.cause="vspike"; return; } continue; }
    if(o.st===0 && Math.abs(pcx-o.x)<110 && Math.abs(pcy-o.y)<90){ o.st=1; o.t=D.spike; }
    else if(o.st===1){ o.t-=dt; if(o.t<=0){ o.st=2; o.t=0.30; } }
    else if(o.st===2){
      const r={x:o.x-15,y:o.y+6,w:30,h:14};
      if(rectsOverlap(prect,r)){ S.outcome="dead"; S.cause="spike"; return; }
      o.t-=dt;
      if(o.t<=0){ o.st=4;
        const tx=Math.floor(o.x/TILE), ty=Math.floor(o.y/TILE);
        if(tx>=0&&tx<COLS&&ty>=0&&ty<ROWS) L.grid[ty*COLS+tx]=1;
      }
    }
  }
  for(const b of L.blocks){
    if(b.st===3) continue;
    if(b.st===0){
      const below=(p.y>=b.y+b.h-1)&&(p.y-(b.y+b.h))<240;
      const hov=pcx>b.x-60&&pcx<b.x+b.w+60;
      if(below&&hov){ b.st=1; b.t=D.block; }
    }else if(b.st===1){ b.t-=dt; if(b.t<=0){ b.st=2; b.vy=0; } }
    else if(b.st===2){
      b.vy=Math.min(1400,b.vy+GRAV*dt); b.y+=b.vy*dt;
      const r={x:b.x+4,y:b.y+4,w:b.w-8,h:b.h-8};
      if(rectsOverlap(prect,r)){ S.outcome="dead"; S.cause="block"; return; }
      const ty2=Math.floor((b.y+b.h+2)/TILE), txm=Math.floor((b.x+b.w/2)/TILE);
      if(solidAt(L.grid,txm,ty2)||ty2>=ROWS){
        b.y=ty2*TILE-b.h; b.st=3;
        const yA=Math.floor(b.y/TILE), yB=Math.floor((b.y+b.h-1)/TILE);
        const xA=Math.floor(b.x/TILE), xB=Math.floor((b.x+b.w-1)/TILE);
        for(let yy=yA;yy<=yB;yy++) for(let xx=xA;xx<=xB;xx++)
          if(xx>=0&&xx<COLS&&yy>=0&&yy<ROWS) L.grid[yy*COLS+xx]=1;
      }
    }
  }
  for(const s of L.saws){
    if(s.ax==="h"){ s.x+=s.dir*s.spd*dt; if(s.x>=s.max){s.x=s.max;s.dir=-1;} if(s.x<=s.min){s.x=s.min;s.dir=1;} }
    else{ s.y+=s.dir*s.spd*dt; if(s.y>=s.max){s.y=s.max;s.dir=-1;} if(s.y<=s.min){s.y=s.min;s.dir=1;} }
    const r={x:s.x-13,y:s.y-13,w:26,h:26};
    if(rectsOverlap(prect,r)){ S.outcome="dead"; S.cause="saw"; return; }
  }
  for(const s of L.chasers){
    const want=Math.max(-55*dt,Math.min(55*dt,(pcx-s.x)*4*dt));
    s.x+=want; if(s.x>s.max)s.x=s.max; if(s.x<s.min)s.x=s.min;
    const r={x:s.x-13,y:s.y-13,w:26,h:26};
    if(rectsOverlap(prect,r)){ S.outcome="dead"; S.cause="chaser"; return; }
  }
  const zr={x:0,y:0,w:0,h:0};
  for(const z of L.zones){
    if(z.used) continue;
    zr.x=z.tx*TILE; zr.y=z.ty*TILE; zr.w=TILE; zr.h=TILE;
    if(rectsOverlap(prect,zr)){ z.used=true;
      const d=L.doors[z.pair]; if(d) openDoor(S,d); }
  }
  for(const bt of L.buttons){
    if(bt.used) continue;
    if(p.grounded&&footTX===bt.tx&&footTY===bt.ty){ bt.used=true;
      const d=L.doors[bt.pair]; if(d) openDoor(S,d); }
  }
  for(const r of L.runners){
    if(!r.moved && Math.abs(pcx-(r.x+r.w/2))<170 && Math.abs(pcy-(r.y+r.h/2))<150){
      r.moved=true; const n=mkDoor(r.ax,r.ay); r.x=n.x; r.y=n.y; r.w=n.w; r.h=n.h; S.runnerMoved=r;
    }
  }
  for(const f of L.fakes){ if(rectsOverlap(prect,f)){ S.outcome="dead"; S.cause="fake"; return; } }
  for(const e of L.exits){ if(rectsOverlap(prect,e)){ S.outcome="win"; return; } }
  for(const r of L.runners){ if(rectsOverlap(prect,r)){ S.outcome="win"; return; } }
  for(const d of L.doors){ if(d.st===1){
    const dr={x:d.tx*TILE+2,y:d.ty*TILE,w:36,h:40};
    if(rectsOverlap(prect,dr)){ S.outcome="win"; return; } } }
  if(p.y>VH+80){ S.outcome="dead"; S.cause="fall"; }
}

function stepGame(S,inp,dt){
  if(S.outcome) return S.outcome;
  const p=S.p;
  p.coyote-=dt; p.buffer-=dt;
  if(inp.jumpPressed) p.buffer=BUFFER;
  const want=((inp.right?1:0)-(inp.left?1:0))*MOVE;
  const acc=p.grounded?ACCG:ACCA;
  if(p.vx<want) p.vx=Math.min(want,p.vx+acc*dt);
  else p.vx=Math.max(want,p.vx-acc*dt);
  if(want!==0) p.face=(want>0?1:-1);
  if(p.buffer>0&&(p.grounded||p.coyote>0)){
    p.vy=-JUMPV; p.grounded=false; p.coyote=0; p.buffer=0;
  }
  let gv=GRAV;
  if(!inp.jump&&p.vy<0) gv*=RELGRAV;
  p.vy=Math.min(MAXFALL,p.vy+gv*dt);
  p.grounded=false;
  p.x+=p.vx*dt; collideAxis(S,0);
  p.y+=p.vy*dt; collideAxis(S,1);
  if(p.grounded) p.coyote=COYOTE;
  S.time+=dt;
  updateTraps(S,dt);
  return S.outcome;
}
/*ENGINE_END*/
/* ==================== LEVEL DATA (injected by build) ==================== */
const LEVELS=[
  {"name": "First Steps",
   "map": [
    "........................",
    "........................",

    "........................",
    "........................",
    "........................",
    "........................",
    "........................",
    "........................",

    ".P....................E.",
    "########################",
    "........................"
   ]},
  {"name": "Trust Nothing",
   "map": [
    "........................",

const SAVE_KEY='trapdevil_v1';

try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&typeof s.unlocked==='number') save=s; }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ==================== AUDIO — procedural chiptune ==================== */
const AU={
  ctx:null, step:0, timer:null,
  init(){ if(this.ctx) return;
    try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(save.music) this.startMusic(); }catch(e){} },
  toggle(){ save.music=!save.music; persist();
    document.getElementById('musicbtn').innerHTML=save.music?'&#9834;':'&#9835;';
    if(!this.ctx) return;
    if(save.music){ this.ctx.resume(); this.startMusic(); } else this.stopMusic(); },
  tone(f,t0,dur,type,vol){ const c=this.ctx; if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.02); },
  sfx(n){ if(!this.ctx) return; const t=this.ctx.currentTime;
    if(n==='jump') this.tone(300,t,0.12,'square',0.08);
    else if(n==='die'){ this.tone(150,t,0.18,'sawtooth',0.12); this.tone(80,t+0.04,0.22,'square',0.10); }
    else if(n==='win'){ const N=[523,659,784,1047]; N.forEach((f,i)=>this.tone(f,t+i*0.09,0.18,'square',0.10)); }
    else if(n==='pop') this.tone(700,t,0.07,'square',0.06);
    else if(n==='click'){ this.tone(1200,t,0.06,'square',0.07); this.tone(900,t+0.07,0.08,'square',0.07); } },
  startMusic(){ if(this.timer||!this.ctx) return;
    const bass=[110,0,110,0,130.8,0,110,0, 98,0,98,0,146.8,0,130.8,0,
                110,0,110,0,130.8,0,110,0, 98,0,164.8,0,146.8,0,130.8,123.5];
    const lead=[440,0,523,0,587,0,523,440, 392,0,440,0,523,0,587,659,
                0,0,440,0,523,0,587,0, 659,0,587,523,440,0,392,0];
    const stepDur=60/142/2;
    this.timer=setInterval(()=>{ if(!save.music||!this.ctx) return;
      const t=this.ctx.currentTime+0.02, i=this.step%32;
      if(bass[i]) this.tone(bass[i],t,stepDur*0.9,'triangle',0.09);
      if(lead[i]) this.tone(lead[i],t,stepDur*0.85,'square',0.04);
      this.step++;
    }, (60/142/2)*1000); },
  stopMusic(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } }
};
/* ==================== RENDERER — flat vector minimalist ==================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

const parts=[];
function spawnP(x,y,vx,vy,l,sz,c,g){ if(parts.length<170) parts.push({x:x,y:y,vx:vx,vy:vy,l:l,sz:sz,c:c,g:g||0}); }
function burst(x,y,n,c,spd,sz,g){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, s=spd*(0.3+Math.random()*0.7);
  spawnP(x,y,Math.cos(a)*s,Math.sin(a)*s-70,0.45+Math.random()*0.4,sz*(0.6+Math.random()*0.8),c,g); } }
function dust(x,y,n){ for(let i=0;i<n;i++) spawnP(x+(Math.random()-0.5)*22,y-2,(Math.random()-0.5)*170,-Math.random()*70-20,0.3+Math.random()*0.2,3+Math.random()*3,TH.plat,320); }
function spark(x,y,n,c){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, s=60+Math.random()*150;
  spawnP(x,y,Math.cos(a)*s,Math.sin(a)*s,0.22+Math.random()*0.18,3,c||'#ffffff',520); } }

let landT=0;

function drawLevel(S,t){
  /* portrait camera: zoom + follow player so the game stays playable upright */
  let cam=null;
  if(innerHeight>innerWidth && S && S.p){
    const z=2.0, vw=VW/z, vh=VH/z;
    const px=S.p.x+PW/2, py=S.p.y+PH/2;
    let cx=Math.min(Math.max(px-vw/2,0),VW-vw);
    let cy=Math.min(Math.max(py-vh/2,0),VH-vh);
    if(vw>=VW)cx=(VW-vw)/2; if(vh>=VH)cy=(VH-vh)/2;
    cam={z,cx,cy,vw,vh};
  }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=TH.bg; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  if(cam){ ctx.translate(cv.width/2,cv.height/2); ctx.scale(cam.z,cam.z);
    ctx.translate(-(cam.cx+cam.vw/2),-(cam.cy+cam.vh/2)); }
  /* subtle inner frame */
  ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=10; ctx.strokeRect(5,5,VW-10,VH-10);
  const L=S.L, g=L.grid;
  /* solid tiles — perfectly flat */
  ctx.fillStyle=TH.plat;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++)
    if(g[y*COLS+x]===1) ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
  for(const gh of L.ghosts) ctx.fillRect(gh.tx*TILE,gh.ty*TILE,TILE,TILE);
  /* shaking pits & crumbles */
  for(const o of L.pits) if(o.st===1){ const j=(Math.random()*5-2)|0;
    ctx.fillRect(o.tx*TILE+j,o.ty*TILE,TILE,TILE); }
  for(const o of L.crumbles) if(o.st===1){ const j=(Math.random()*5-2)|0;
    ctx.fillRect(o.tx*TILE+j,o.ty*TILE,TILE,TILE); }
  /* blink platforms — dotted outline, always (their signature look) */
  for(const o of L.blinks){
    const on=L.grid[o.ty*COLS+o.tx]===1, px=o.tx*TILE, py=o.ty*TILE;
    ctx.fillStyle=TH.plat;
    if(on){ for(let d=0;d<TILE;d+=10){ ctx.fillRect(px+d,py,6,6); ctx.fillRect(px+d,py+TILE-6,6,6); } }
    else{ ctx.globalAlpha=.45;
      for(let d=0;d<TILE;d+=10){ ctx.fillRect(px+d,py,6,6); ctx.fillRect(px+d,py+TILE-6,6,6); }
      ctx.globalAlpha=1; }
  }
  /* pop-up spikes + erupted ridges + static spikes + fake spikes */
  for(const o of L.spikes){
    if(o.st===0) continue;
    if(o.st===1){ ctx.fillStyle=TH.plat; ctx.fillRect(o.x-15,o.y+18,30,5); }
    else if(o.st===4){ ctx.fillStyle=TH.plat; ctx.fillRect(o.x-20,o.y+2,40,18); }  /* walkable ridge */
    else drawSpikeStrip(o.x-15,o.y+6,30,14);
  }
  for(const o of L.fspikes) drawSpikeStrip(o.x-15,o.y+6,30,14);
  /* falling blocks */
  ctx.fillStyle=TH.plat;
  for(const b of L.blocks){
    if(b.st===3) continue;
    const j=b.st===1?(Math.random()*5-2)|0:0;
    ctx.fillRect(b.x+j,b.y,b.w,b.h);
  }
  /* trigger buttons */
  for(const bt of L.buttons){ if(bt.used) continue;
    ctx.fillStyle=TH.plat;
    ctx.fillRect(bt.tx*TILE+10,bt.ty*TILE-8,20,10); }
  /* saws & chasers */
  for(const s of L.saws) drawSaw(s.x,s.y,t,false);
  for(const s of L.chasers) drawSaw(s.x,s.y,t,true);
  /* exits: real, runners, fakes — all identical white doors */
  for(const e of L.exits) drawDoor(e.x,e.y,e.w,e.h);
  for(const r of L.runners) drawDoor(r.x,r.y,r.w,r.h);
  for(const f of L.fakes) drawDoor(f.x,f.y,f.w,f.h);
  /* hidden doors: flush wall until opened */
  for(const d of L.doors){
    if(d.st===0){ ctx.fillStyle=TH.plat; ctx.fillRect(d.tx*TILE,d.ty*TILE,TILE,TILE); }
    else drawDoor(d.tx*TILE+4,d.ty*TILE,32,40);
  }
  drawPlayer(S.p,t);
  for(let i=0;i<parts.length;i++){ const q=parts[i];
    ctx.globalAlpha=Math.max(0,Math.min(1,q.l*1.8)); ctx.fillStyle=q.c; ctx.fillRect(q.x,q.y,q.sz,q.sz); }
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawSpikeStrip(x,y,w,h){
  ctx.fillStyle=TH.plat; const n=Math.max(2,Math.round(w/10));
  for(let i=0;i<n;i++){ const sx=x+i*(w/n);
    ctx.beginPath(); ctx.moveTo(sx,y+h); ctx.lineTo(sx+w/n/2,y); ctx.lineTo(sx+w/n,y+h); ctx.fill(); }
}
function drawSaw(x,y,t,chaser){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y)); ctx.rotate(t*8);
  ctx.fillStyle=TH.plat;
  for(let i=0;i<8;i++){ ctx.rotate(Math.PI/4);
    ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(5,-13); ctx.lineTo(-5,-13); ctx.closePath(); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0,0,12,0,7); ctx.fill();
  ctx.fillStyle=TH.bg; ctx.beginPath(); ctx.arc(0,0,chaser?6:4,0,7); ctx.fill();
  ctx.restore();
}
/* small white door, dark outline — Level Devil's door language */
function drawDoor(x,y,w,h){
  ctx.fillStyle=TH.plat; ctx.fillRect(x-3,y-3,w+6,h+6);
  ctx.fillStyle=TH.door;
  ctx.fillRect(x+6,y,w-12,8);
  ctx.fillRect(x,y+8,w,h-8);
}
/* tiny black silhouette humanoid — run cycle + squash & stretch */
function drawPlayer(p,t){
  if(p.hidden) return;
  const feetY=Math.round(p.y+PH);
  const air=p.vy<-220;
  const h=PH+(air?2:0)-(landT>0?4:0);
  const x=Math.round(p.x+PW/2), y=feetY-h;
  const moving=Math.abs(p.vx)>40, g=p.grounded;
  const fr=(g&&moving)?(Math.floor(t*11)%2):0;
  ctx.fillStyle=TH.char;
  ctx.beginPath(); ctx.arc(x,y+6,6,0,7); ctx.fill();          /* head */
  ctx.fillRect(x-4,y+10,8,9);                                 /* torso */
  if(!g){ ctx.fillRect(x-4,y+19,5,4); ctx.fillRect(x+1,y+19,5,4); }        /* tucked */
  else if(fr===0){ ctx.fillRect(x-5,y+19,4,6); ctx.fillRect(x+2,y+19,4,4); }
  else{ ctx.fillRect(x-5,y+19,4,4); ctx.fillRect(x+2,y+19,4,6); }           /* run cycle */
  const ax=p.face>0?1:-1;                                     /* arm swing */
  ctx.fillRect(x+ax*4-2,y+11+(fr?0:2),4,7);
}
function trapFx(S){
  const F=S._fx||(S._fx={}), L=S.L;
  L.pits.forEach((o,i)=>{ const k='p'+i; if(o.st===1&&!F[k]){ F[k]=1; spark(o.tx*TILE+20,o.ty*TILE+12,6,TH.plat); } });
  L.crumbles.forEach((o,i)=>{ const k='c'+i; if(o.st===1&&!F[k]){ F[k]=1; spark(o.tx*TILE+20,o.ty*TILE+12,6,TH.plat); } });
  L.spikes.forEach((o,i)=>{ const k='s'+i; if(o.st===2&&!F[k]){ F[k]=1; spark(o.x,o.y+10,8,TH.plat); AU.sfx('pop'); } });
  L.blocks.forEach((o,i)=>{ const k='b'+i; if(o.st===2&&!F[k]){ F[k]=1; dust(o.x+20,o.y+40,5); } });
  if(S.doorOpened&&!F.door){ F.door=1; const d=S.doorOpened;
    spark(d.tx*TILE+20,d.ty*TILE+20,10,'#ffffff'); AU.sfx('click'); }
  if(S.runnerMoved&&!F.run){ F.run=1; const r=S.runnerMoved;
    spark(r.x+r.w/2,r.y+r.h/2,10,'#ffffff'); }
}
function stepFx(dt){
  if(landT>0) landT-=dt;
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.l-=dt;
    if(q.l<=0){ parts.splice(i,1); continue; }
    q.vy+=q.g*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; }
}
/* ==================== INPUT ==================== */
const inp={left:false,right:false,jump:false,jumpPressed:false};
let prevJump=false;
const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump'};
addEventListener('keydown',e=>{
  AU.init();
  if(keymap[e.code]){ inp[keymap[e.code]]=true; e.preventDefault(); }
  if(e.code==='KeyR') retryLevel();
  if(e.code==='Escape') showMenu();
});
addEventListener('keyup',e=>{ if(keymap[e.code]) inp[keymap[e.code]]=false; });
function bindTouch(id,name){
  const el=document.getElementById(id);
  const on=e=>{ e.preventDefault(); AU.init(); inp[name]=true; };
  const off=e=>{ e.preventDefault(); inp[name]=false; };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off); el.addEventListener('pointerleave',off);
}
bindTouch('tleft','left'); bindTouch('tright','right'); bindTouch('tjump','jump');
if('ontouchstart' in window) document.getElementById('touch').classList.add('on');

/* ==================== GAME FLOW — INSTANT respawn, zero friction ==================== */
let cur=0, S=null, acc=0, lastT=0, deathsThis=0;
const DT=1/60;
const menuEl=document.getElementById('menu');
const menuOpen=()=>!menuEl.classList.contains('hidden');

function fit(){
  const ww=innerWidth, wh=innerHeight, a=VW/VH;
  let w=ww, h=ww/a; if(h>wh){ h=wh; w=wh*a; }
  cv.style.width=w+'px'; cv.style.height=h+'px';
}
addEventListener('resize',fit); fit();

function startLevel(i){
  cur=i; applyWorld(i);
  S=newGameState(LEVELS[i]); deathsThis=save.deaths[i]||0;
  acc=0; lastT=performance.now();
  menuEl.classList.add('hidden');
  updateHud();
  flash('LEVEL '+(i+1));
}
/* death: blood burst + SAME-FRAME respawn. No fade, no delay, no input lockout. */
function onDeath(){
  deathsThis++; save.deaths[cur]=deathsThis; save.total++; persist();
  const cx=S.p.x+PW/2, cy=S.p.y+PH/2;
  burst(cx,cy,24,TH.blood,360,5,900);
  burst(cx,cy,9,TH.blood,200,8,700);
  AU.sfx('die');
  S=newGameState(LEVELS[cur]); acc=0;   /* instant */
  updateHud();
}
function retryLevel(){
  if(!S||menuOpen()) return;
  onDeath();
}
function onWin(){
  AU.sfx('win');
  burst(S.p.x+PW/2,S.p.y,12,TH.door,240,4,300);
  if(cur+1>save.unlocked&&cur+1<LEVELS.length){ save.unlocked=cur+1; persist(); }
  if(cur+1<LEVELS.length) startLevel(cur+1);
  else { flash('YOU BEAT ALL 103!'); showMenu(); }
}
function updateHud(){
  document.getElementById('deaths').innerHTML='&#9760; '+deathsThis;
  document.getElementById('plabel').textContent=(cur+1)+'/103 '+WNAMES[worldOf(cur)];
  const sqs=document.querySelectorAll('#prog .sq');
  const seg=Math.floor(cur/5)*5;
  sqs.forEach((el,k)=>{ el.classList.toggle('on', seg+k<save.unlocked); });
}
let flashTimer=null;
function flash(t){
  const f=document.getElementById('flash'); f.textContent=t; f.style.opacity=1;
  if(flashTimer) clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{ f.style.transition='opacity .5s'; f.style.opacity=0;
    setTimeout(()=>f.style.transition='',550); },800);
}

function showMenu(){
  applyWorld(Math.min(save.unlocked,LEVELS.length-1));
  menuEl.classList.remove('hidden');
  document.getElementById('musicbtn').innerHTML=save.music?'&#9834;':'&#9835;';
  document.getElementById('menustats').textContent='DEATHS '+save.total+' · CLEARED '+save.unlocked+'/103';
  document.getElementById('pfill').style.width=(save.unlocked/LEVELS.length*100)+'%';
  const gr=document.getElementById('grid'); gr.innerHTML='';
  for(let i=0;i<LEVELS.length;i++){
    const b=document.createElement('button');
    b.textContent=i+1; b.className='lv'+(i<save.unlocked?' done':i===save.unlocked?' cur':' locked');
    if(i<=save.unlocked) b.onclick=()=>{ AU.init(); startLevel(i); };
    gr.appendChild(b);
  }
}
document.getElementById('playbtn').onclick=()=>{ AU.init(); startLevel(Math.min(save.unlocked,LEVELS.length-1)); };
document.getElementById('menubtn').onclick=()=>showMenu();
document.getElementById('retrybtn').onclick=()=>retryLevel();
document.getElementById('musicbtn').onclick=()=>AU.toggle();

/* main loop — fixed timestep, 60fps */
function frame(t){
  requestAnimationFrame(frame);
  const tt=t/1000;
  if(!S||menuOpen()){ if(S){ stepFx(1/60); drawLevel(S,tt); } return; }
  let dt=(t-lastT)/1000; lastT=t; if(dt>0.25)dt=0.25;
  inp.jumpPressed=inp.jump&&!prevJump; prevJump=inp.jump;
  const wasG=S.p.grounded, pv=S.p.vy;
  acc+=dt; let n=0;
  while(acc>=DT&&n<5){ const r=stepGame(S,inp,DT); acc-=DT; n++;
    if(r==='dead'){ onDeath(); break; }
    if(r==='win'){ onWin(); break; } }
  if(S&&!wasG&&S.p.grounded&&pv>380){ dust(S.p.x+PW/2,S.p.y+PH,8); landT=0.13; }
  if(S){ trapFx(S); stepFx(dt); drawLevel(S,tt); }
}
showMenu();
requestAnimationFrame(t=>{ lastT=t; requestAnimationFrame(frame); });
</script>
</body>
